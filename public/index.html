<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM AI Outbound Engine</title>
<style>
/* Design tokens ------------------------------------------------------------
   Light theme — white/near-white ground so it reads as a familiar, modern
   SaaS console rather than a dark ops terminal. Not a verified reproduction
   of JumpCloud's own brand palette (couldn't fetch their site to confirm
   exact hex values) — this is a professional identity/security-adjacent
   teal-green accent chosen to feel at home next to that kind of product.
   Color: Ink #F7F8FA (bg), Panel #FFFFFF (surfaces), Line #E2E6EB (borders),
   Text #101828 (primary) / #64748B (muted), Accent #0E8F76 (teal-green),
   Tier B #B45309 (amber), Tier C #64748B (slate)
   Type: "Inter" for headings/nav, "IBM Plex Sans" for everything else —
   no monospace anywhere, including scores, tags, and code-like values.
   Layout: fixed left rail + main content, left-aligned, dense data tables —
   this reads as an internal ops console, not a marketing page.
---------------------------------------------------------------------------- */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --ink: #F7F8FA;
  --panel: #FFFFFF;
  --panel-2: #F1F3F5;
  --line: #E2E6EB;
  --text: #101828;
  --muted: #64748B;
  --accent: #0E8F76;
  --accent-dim: #E3F5EF;
  --tier-a: #0E8F76;
  --tier-b: #B45309;
  --tier-c: #64748B;
  --good: #16A34A;
  --warn: #B45309;
  --bad: #DC2626;
  --rail-bg: #0B2340;
  --rail-bg-2: #123258;
  --rail-text: #F3F6FA;
  --rail-muted: #93A9C7;
  --rail-line: rgba(255,255,255,.08);
  --font-head: 'Inter', sans-serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Sans', sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
::selection { background: var(--accent-dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; min-height: 100vh; }

/* --- Rail --- */
.rail {
  width: 240px;
  flex-shrink: 0;
  background: var(--rail-bg);
  border-right: 1px solid var(--rail-line);
  padding: 22px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.rail-brand {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.01em;
  margin-bottom: 2px;
  color: var(--rail-text);
}
.rail-sub { color: var(--rail-muted); font-size: 12px; margin-bottom: 14px; }
.rail-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.1); color: #6FE3C4;
  font-family: var(--font-mono); font-size: 11px;
  padding: 4px 8px; border-radius: 4px; margin-bottom: 8px;
}
.rail-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #6FE3C4; }
.rail-badge.live { background: rgba(255,255,255,.1); color: #7BE0A0; }
.rail-badge.live::before { background: #7BE0A0; }
.rail nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
.rail nav button {
  all: unset; cursor: pointer;
  color: var(--rail-muted); font-family: var(--font-body); font-size: 13.5px; font-weight: 500;
  padding: 9px 10px; border-radius: 6px; display: flex; align-items: center; gap: 9px;
}
.rail nav button:hover { background: var(--rail-bg-2); color: var(--rail-text); }
.rail nav button.active { background: var(--rail-bg-2); color: var(--rail-text); box-shadow: inset 3px 0 0 var(--accent); }
.rail nav button .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .55; }

/* --- Main --- */
.main { flex: 1; min-width: 0; padding: 30px 40px 60px; max-width: 1180px; }
.page-head { margin-bottom: 26px; }
.page-head h1 { font-family: var(--font-head); font-size: 22px; margin: 0 0 4px; font-weight: 600; }
.page-head p { color: var(--muted); margin: 0; max-width: 680px; }

/* --- KPI grid --- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 26px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 16px 16px 14px;
}
.kpi .v { font-family: var(--font-head); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; margin-top: 4px; }
.kpi .v.tier-a { color: var(--tier-a); }
.kpi .v.tier-b { color: var(--tier-b); }
.kpi .v.tier-c { color: var(--tier-c); }

/* --- Panels / tables --- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 22px; overflow: hidden; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap;
}
.panel-head h2 { font-family: var(--font-head); font-size: 14px; font-weight: 600; margin: 0; }
.panel-head .hint { color: var(--muted); font-size: 12px; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 500; padding: 10px 16px; border-bottom: 1px solid var(--line); }
td { padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--panel-2); }
.score { font-family: var(--font-body); font-weight: 700; font-variant-numeric: tabular-nums; }

.tier-pill {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 5px;
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
}
.tier-pill.A { background: var(--tier-a); color: #FFFFFF; }
.tier-pill.B { background: var(--tier-b); color: #FFFFFF; }
.tier-pill.C { background: var(--tier-c); color: #FFFFFF; }

.tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; display: inline-block; }
.tag.route-bdr { color: #FFFFFF; background: var(--good); border-color: var(--good); }
.tag.route-enrich { color: #FFFFFF; background: var(--warn); border-color: var(--warn); }
.tag.route-nurture { color: #FFFFFF; background: var(--accent); border-color: var(--accent); }
.tag.route-suppress { color: #FFFFFF; background: var(--bad); border-color: var(--bad); }

/* --- Detail view --- */
.detail-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
.field-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.field-row:last-child { border-bottom: none; }
.field-row .k { color: var(--muted); }
.field-row .val { text-align: right; max-width: 62%; }
.body-pad { padding: 16px; }
.evidence-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel-2); }
.evidence-card:last-child { margin-bottom: 0; }
.evidence-card .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.evidence-card .name { font-weight: 600; font-size: 13px; }
.evidence-card .name.off { color: var(--muted); font-weight: 500; }
.evidence-card .meta { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.evidence-card .evidence-text { font-family: var(--font-mono); font-size: 12px; color: var(--text); margin-top: 4px; }
.pill-conf { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 6px; border-radius: 4px; }
.pill-conf.high { background: rgba(22,163,74,.16); color: var(--good); }
.pill-conf.medium { background: rgba(180,83,9,.16); color: var(--warn); }
.pill-conf.low, .pill-conf\.n\/a { background: rgba(100,116,139,.2); color: var(--muted); }
.reasoning-block { font-size: 13.5px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.reasoning-block:last-child { border-bottom: none; }
.reasoning-block .k { color: var(--muted); font-size: 11.5px; text-transform: none; margin-bottom: 4px; }
.inference-tag { font-family: var(--font-mono); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-right: 6px; letter-spacing: .02em; }
.inference-tag.INFERENCE { background: rgba(180,83,9,.18); color: var(--warn); }
.inference-tag.FACT { background: rgba(22,163,74,.16); color: var(--good); }
.outreach-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px; font-size: 13.5px; }
.outreach-card .subj { font-weight: 600; margin-bottom: 8px; }
.back-btn { all: unset; cursor: pointer; color: var(--accent); font-size: 13px; margin-bottom: 16px; display: inline-block; }

.score-bars { display: flex; flex-direction: column; gap: 10px; }
.score-bar-row { }
.score-bar-row .lbl { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
.score-bar-row .lbl .n { font-family: var(--font-body); font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.bar-track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }

.explain-list { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 12px; }
.explain-list li { padding: 4px 0; color: var(--muted); border-bottom: 1px dashed var(--line); }
.explain-list li:last-child { border-bottom: none; }
.explain-list li.pos { color: var(--good); }

/* --- Architecture --- */
.pipeline-stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ps-node { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer; transition: background .12s, border-color .12s; }
.ps-node:hover { border-color: var(--muted); }
.ps-node .ps-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ps-node.engine .ps-dot { background: var(--tier-c); }
.ps-node.agent .ps-dot { background: var(--warn); }
.ps-node.gate .ps-dot { background: var(--accent); }
.ps-node.active { color: #fff; border-color: transparent; }
.ps-node.engine.active { background: var(--tier-c); }
.ps-node.agent.active { background: var(--warn); }
.ps-node.gate.active { background: var(--accent); }
.ps-node.active .ps-dot { background: #fff; }
.ps-arrow { color: var(--muted); font-size: 12px; }
.ps-detail { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--panel-2); min-height: 74px; }
.ps-detail h4 { margin: 0 0 4px; font-family: var(--font-head); font-size: 14.5px; font-weight: 600; color: var(--text); }
.ps-detail p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
.ps-detail .ps-branch { margin-top: 6px; color: var(--warn); font-weight: 600; font-size: 12.5px; }
.ps-detail .fc-badge { flex-shrink: 0; font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 20px; margin-top: 2px; }
.ps-detail .fc-badge.engine { background: rgba(100,116,139,.16); color: var(--tier-c); }
.ps-detail .fc-badge.agent { background: rgba(180,83,9,.16); color: var(--warn); }
.ps-detail .fc-badge.gate { background: rgba(14,143,118,.16); color: var(--accent); }
.stack-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 4px; }
.stack-col h3 { font-family: var(--font-head); font-size: 13px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.stack-col .stack-note { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; }
.stack-col ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.stack-col ul li { margin-bottom: 6px; }
.stack-col ul li .live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--good); margin-right:6px; }
.stack-col ul li .design-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--muted); margin-right:6px; }

.filter-row { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.filter-row button {
  all: unset; cursor: pointer; font-size: 12px; font-family: var(--font-mono);
  padding: 5px 10px; border-radius: 5px; color: var(--muted); border: 1px solid var(--line);
}
.filter-row button.active { color: var(--text); border-color: var(--accent); background: var(--accent-dim); }

.simulated-note {
  font-size: 12px; color: var(--muted); background: var(--panel-2);
  border: 1px dashed var(--line); border-radius: 6px; padding: 9px 12px; margin-bottom: 18px;
}
.icp-note {
  font-size: 12.5px; color: var(--warn); background: rgba(180,83,9,.08);
  border: 1px dashed rgba(180,83,9,.4); border-radius: 6px; padding: 10px 12px; margin-bottom: 18px;
}

/* --- MCP tool cards --- */
.mcp-tool { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.mcp-tool:last-child { margin-bottom: 0; }
.mcp-tool-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--panel-2); flex-wrap: wrap; }
.mcp-tool-head .tname { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
.perm-pill { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: .02em; }
.perm-pill.READ { background: rgba(14,143,118,.16); color: var(--accent); }
.perm-pill.WRITE { background: rgba(220,38,38,.16); color: var(--bad); }
.approval-pill { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 8px; border-radius: 4px; background: rgba(180,83,9,.16); color: var(--warn); }
.mcp-tool-body { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; font-size: 12.5px; }
.mcp-tool-body .k { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
.mcp-tool-body .v { font-family: var(--font-mono); font-size: 12px; }
.mcp-tool-body .full { grid-column: 1 / -1; }

/* --- ICP config --- */
.cfg-row { display: grid; grid-template-columns: 1fr 120px; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.cfg-row:last-child { border-bottom: none; }
.cfg-row input[type="number"], .cfg-row input[type="text"] {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  border-radius: 5px; padding: 6px 8px; font-family: var(--font-mono); font-size: 12.5px; width: 100%;
}
.cfg-checks { display: flex; flex-wrap: wrap; gap: 8px; }
.cfg-chip { font-family: var(--font-mono); font-size: 11.5px; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; user-select: none; }
.cfg-chip.on { color: var(--text); border-color: var(--accent); background: var(--accent-dim); }
.cfg-actions { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); }
.btn { all: unset; cursor: pointer; font-family: var(--font-mono); font-size: 12.5px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); color: var(--text); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
.btn.primary:hover { background: #0B7862; }
.btn.small { padding: 5px 10px; font-size: 11.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* --- Sequence --- */
.seq-step { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.seq-step:last-child { border-bottom: none; }
.seq-day { font-family: var(--font-mono); font-size: 12px; color: var(--accent); width: 64px; flex-shrink: 0; padding-top: 2px; }
.seq-body .chan { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
.seq-body .desc { color: var(--muted); font-size: 12.5px; }
.feedback-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.feedback-item { border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; font-size: 12.5px; }
.feedback-item .trig { font-family: var(--font-mono); color: var(--warn); font-size: 11px; margin-bottom: 3px; }

/* --- Agent run trace --- */
.run-step { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.run-step:last-child { border-bottom: none; }
.run-step .badge { flex-shrink: 0; width: 60px; text-align: center; font-family: var(--font-mono); font-size: 10px; font-weight: 700; padding: 3px 0; border-radius: 4px; letter-spacing: .02em; height: fit-content; }
.run-step .badge.engine { background: rgba(100,116,139,.2); color: var(--muted); }
.run-step .badge.agent { background: rgba(180,83,9,.18); color: var(--warn); }
.run-step .badge.gate { background: rgba(14,143,118,.16); color: var(--accent); }
.run-step .name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
.run-step .detail { color: var(--muted); font-size: 12.5px; }
.run-step .detail.fail { color: var(--bad); }
.run-step .conf { font-family: var(--font-mono); font-size: 10.5px; color: var(--warn); margin-left: 6px; }
.decision-trace-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.ops-criteria-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* --- System at a glance --- */
.glance-row { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; padding: 4px 4px 6px; }
.glance-card { flex: 1 1 160px; min-width: 160px; border-radius: 10px; padding: 16px 14px; border: 1px solid var(--line); }
.glance-card .emoji { font-size: 22px; margin-bottom: 8px; display: block; }
.glance-card h4 { margin: 0 0 6px; font-family: var(--font-head); font-size: 14px; font-weight: 700; }
.glance-card p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.glance-card.data { background: #F1F3F5; border-color: var(--line); }
.glance-card.engine { background: #F1F3F5; border-color: var(--line); }
.glance-card.agent { background: #FFF8F0; border-color: rgba(180,83,9,.25); }
.glance-card.human { background: var(--accent-dim); border-color: rgba(14,143,118,.3); }
.glance-card.out { background: #F1F3F5; border-color: var(--line); }
.glance-arrow { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; flex: 0 0 auto; padding: 0 2px; }
@media (max-width: 900px) { .glance-arrow { transform: rotate(90deg); } }

.mini-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 14px 4px; }
.mini-flow .mf-node { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; }
.mini-flow .mf-arrow { color: var(--muted); font-size: 14px; }
.tech-ref { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.9; }
.tech-ref .k { color: var(--accent); font-weight: 600; }
.compare-table td, .compare-table th { vertical-align: top; }
.compare-table td:first-child { font-weight: 700; white-space: nowrap; }
.compare-table td:not(:first-child) { color: var(--muted); line-height: 1.5; }
.compare-table .live-dot, .compare-table .design-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
.compare-table .live-dot { background: var(--good); }
.compare-table .design-dot { background: var(--line); border: 1px solid var(--muted); }
.decision-trace-grid .dt-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.decision-trace-grid .dt-card .k { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
.decision-trace-grid .dt-card .v { font-size: 13px; line-height: 1.45; }
.autonomy-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.autonomy-row:last-child { border-bottom: none; }
.autonomy-row .dot { font-size: 16px; line-height: 1.3; }
.autonomy-row .label { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.autonomy-row .items { color: var(--muted); font-size: 12.5px; }

/* --- Ask the agent --- */
.ask-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.ask-chip { all: unset; cursor: pointer; font-size: 11.5px; font-family: var(--font-body); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); }
.ask-chip:hover { color: var(--text); border-color: var(--accent); }
.ask-row { display: flex; gap: 8px; }

/* ==========================================================================
   GTM AI OUTBOUND ENGINE — core engine
   Deterministic enrichment, signal detection, scoring, persona, routing.
   AI Research & Reasoning defaults to a deterministic simulator that returns
   the exact JSON shape an OpenAI API call would produce. Optionally, from an
   account's detail page, a viewer can trigger a real OpenAI call for that
   account's reasoning step, run server-side via a Netlify Function holding
   the site owner's own API key — no visitor credential needed. Scoring and
   routing are never touched by that call — see "Design principle" below.

   DESIGN PRINCIPLE: the model is never allowed to set the ICP score or the
   routing decision. Those stay deterministic and reproducible because the
   business reason for scoring at all is to avoid spending model compute and
   seller attention on low-quality accounts — an LLM deciding its own
   priority would defeat that purpose. AI is used only where unstructured
   reasoning adds value: synthesizing evidence, forming a pain hypothesis,

   ========================================================================== */

// ---------------------------------------------------------------------------
// PHASE 1/2 — TARGET ACCOUNT INPUT + ENRICHMENT (REAL DATA)

  { id: "acc_08", company_name: "PostHog", website: "posthog.com", industry: "Software Development", employee_count: 219, headquarters: "San Francisco, CA", countries_of_operation: ["US", "GB", "PT", "ES", "IE"], company_description: "Open-source product analytics platform; Clay's contact search found real employees across the US, UK, Portugal, Spain and Ireland, with no single non-US office on file.", estimated_growth: "+90% headcount YoY", technology_context: "Company's own job postings state: \"We're a natively remote company. We default to async communication\" (quoted from a live PostHog job listing, Sep 2026)", remote_or_hybrid_signal: true, it_hiring_signal: false, security_hiring_signal: false, geographic_expansion_signal: false, last_enriched: "2026-09-04", contact: { name: "Felipe Almeida", title: "Security Engineer", email: "felipe.a@posthog.com", confidence: "high" } },
  { id: "acc_09", company_name: "Buffer", website: "buffer.com", industry: "Technology, Information and Internet", employee_count: 328, headquarters: "San Francisco, CA", countries_of_operation: ["US", "LK", "EE", "PT"], company_description: "Social media management platform; Clay's contact search found real employees across the US, Sri Lanka, Estonia and Portugal.", estimated_growth: "+32% headcount YoY", technology_context: "No currently open IT/security req found via Clay, but a named Security Engineer with a verified work email was found via Clay contact search", remote_or_hybrid_signal: true, it_hiring_signal: false, security_hiring_signal: false, geographic_expansion_signal: false, last_enriched: "2026-09-04", contact: { name: "Adnan Issadeen", title: "Security Engineer", email: "adnan@buffer.com", confidence: "high" } },
  { id: "acc_10", company_name: "Help Scout", website: "helpscout.com", industry: "Technology, Information and Internet", employee_count: 290, headquarters: "Boston, MA", countries_of_operation: ["US", "CA", "IT", "AU"], company_description: "Customer support platform; job postings state \"We've been a fully remote team since day one, with 120+ teammates now all over the world.\"", estimated_growth: "+9% headcount YoY", technology_context: "Open reqs found via Clay (VP of Marketing, Director of Performance Marketing) are not IT/security-specific; a named Director of Privacy and Security was found via Clay contact search", remote_or_hybrid_signal: true, it_hiring_signal: false, security_hiring_signal: false, geographic_expansion_signal: false, last_enriched: "2026-09-04", contact: { name: "Pilar Garcia", title: "Director of Privacy and Security", email: "unknown", confidence: "medium" } },
  { id: "acc_11", company_name: "37signals", website: "37signals.com", industry: "Software Development", employee_count: 176, headquarters: "Chicago, IL", countries_of_operation: ["US", "ES", "BR", "DE", "GB", "CA"], company_description: "Makers of Basecamp and HEY; Clay's contact search found real employees across Spain, Brazil, Germany, the UK and Canada, with only a Chicago office on file.", estimated_growth: "+1% headcount YoY", technology_context: "unknown — no IT/security-specific open reqs found via Clay; headcount is below this demo's 200-employee ICP floor", remote_or_hybrid_signal: false, it_hiring_signal: false, security_hiring_signal: false, geographic_expansion_signal: false, last_enriched: "2026-09-04", contact: { name: "unknown", title: "unknown", email: "unknown", confidence: "low" } },
  { id: "acc_12", company_name: "Loom", website: "loom.com", industry: "Online Audio and Video Media", employee_count: 295, headquarters: "San Francisco, CA", countries_of_operation: ["US"], company_description: "Async video messaging platform, part of Atlassian since 2023; Atlassian's own description of the deal cites championing \"remote-first, asynchronous work.\"", estimated_growth: "+3% headcount YoY", technology_context: "unknown — no IT/security-specific open reqs found via Clay as of this enrichment", remote_or_hybrid_signal: true, it_hiring_signal: false, security_hiring_signal: false, geographic_expansion_signal: false, last_enriched: "2026-09-04", contact: { name: "unknown", title: "unknown", email: "unknown", confidence: "low" } },
  { id: "acc_13", company_name: "GitLab", website: "gitlab.com", industry: "IT Services and IT Consulting", employee_count: 3432, headquarters: "San Francisco, CA", countries_of_operation: ["US"], company_description: "DevSecOps platform, publicly documented as an all-remote company since founding; headcount exceeds this demo's 2,000-employee ICP ceiling.", estimated_growth: "+8% headcount YoY", technology_context: "unknown — open reqs found via Clay were recruiting/engineering roles, not IT/security decision-maker hires", remote_or_hybrid_signal: true, it_hiring_signal: false, security_hiring_signal: false, geographic_expansion_signal: false, last_enriched: "2026-09-04", contact: { name: "unknown", title: "unknown", email: "unknown", confidence: "low" } },
  { id: "acc_14", company_name: "Automattic", website: "wordpress.com", industry: "Software Development", employee_count: 2170, headquarters: "San Francisco, CA", countries_of_operation: ["US", "ES", "TR", "CA", "UY", "BD", "FR", "BR", "DK"], company_description: "Parent company of WordPress.com, WooCommerce, Tumblr and Jetpack; its own description states \"1,730+ Automatticians in 92 countries.\" A real 2025 restructuring announcement is on file.", estimated_growth: "-46% headcount YoY (real restructuring/layoffs per Clay)", technology_context: "unknown — no IT/security-specific open reqs found via Clay; headcount is just above this demo's 2,000-employee ICP ceiling", remote_or_hybrid_signal: true, it_hiring_signal: false, security_hiring_signal: false, geographic_expansion_signal: false, last_enriched: "2026-09-04", contact: { name: "unknown", title: "unknown", email: "unknown", confidence: "low" } },
  { id: "acc_15", company_name: "Doist", website: "doist.com", industry: "Software Development", employee_count: 125, headquarters: "unknown", countries_of_operation: ["US", "ZA", "DE", "GB", "FR", "BR"], company_description: "Makers of Todoist and Twist; its own description states \"our fully remote team of 100+ people across 35+ countries.\" Bootstrapped, never raised venture funding.", estimated_growth: "+6% headcount YoY", technology_context: "unknown — no open reqs found via Clay as of this enrichment; headcount is below this demo's 200-employee ICP floor", remote_or_hybrid_signal: true, it_hiring_signal: false, security_hiring_signal: false, geographic_expansion_signal: false, last_enriched: "2026-09-04", contact: { name: "unknown", title: "unknown", email: "unknown", confidence: "low" } }
];

const TODAY = new Date("2026-09-04T00:00:00Z");

// ---------------------------------------------------------------------------
// PHASE 4 — configurable scoring weights + ICP thresholds
// Editable at runtime from the "ICP Config" tab. Nothing here should be read
// as JumpCloud's actual internal qualification criteria — see the notice on
// that tab.
// ---------------------------------------------------------------------------
const DEFAULT_ICP_CONFIG = {
  headcount_min: 200,
  headcount_max: 2000,
  tierA_threshold: 80,
  tierB_threshold: 60,
  min_signals_for_evidence: 2,
  target_industries: ["Freight & Supply Chain Tech", "Healthcare SaaS", "Industrial Automation",
    "Life Sciences", "Legal Services", "Professional Services", "Education Technology",
    "Gaming / Interactive Media", "Manufacturing", "Financial Services", "Healthcare (Small Practice)",
    "Software Development", "Technology, Information and Internet"],
  target_geos: ["US", "CA", "UK", "GB", "DE", "CH", "AU", "SG", "FR", "MX", "JP"],
  weights: {
    company_fit: { headcount_band: 15, relevant_profile: 10, multi_location: 10, relevant_geo: 5 },
    signals: { it_security_hiring: 15, remote_hybrid: 10, growing_headcount: 10, geo_expansion: 5 },
    contact: { relevant_decision_maker: 10, contact_available: 5, responsibilities_match: 5 }
  }
};

// Mutable working copy — the ICP Config tab edits this, then "Apply" re-runs
// the whole pipeline against the new assumptions.
let ICP_CONFIG = JSON.parse(JSON.stringify(DEFAULT_ICP_CONFIG));

// ---------------------------------------------------------------------------
// PHASE 3 — SIGNAL ENGINE
// Every signal cites the enrichment field it was derived from — nothing here
// is invented beyond the seeded demo record. Each signal also carries an
// observed date + freshness so the UI can show how current the evidence is.
// ---------------------------------------------------------------------------
function daysSince(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  return Math.round((TODAY - d) / 86400000);
}

function detectSignals(c) {
  const signals = [];
  const push = (name, detected, evidence, confidence, source) =>
    signals.push({
      signal_name: name, detected, evidence, confidence, source,
      observed_date: c.last_enriched, freshness_days: daysSince(c.last_enriched)
    });

  push("Remote or distributed workforce", c.remote_or_hybrid_signal,
    c.remote_or_hybrid_signal ? `Workforce flagged remote/hybrid — ${c.technology_context}` : "No remote/hybrid indicator on file",
    c.remote_or_hybrid_signal ? "high" : "n/a", "enrichment.remote_or_hybrid_signal");

  push("IT hiring", c.it_hiring_signal,
    c.it_hiring_signal ? `Open or recent IT req referenced in tech context: "${c.technology_context}"` : "No open IT req detected",
    c.it_hiring_signal ? "high" : "n/a", "enrichment.it_hiring_signal");

  push("Cybersecurity / IAM hiring", c.security_hiring_signal,
    c.security_hiring_signal ? `Security/IAM hiring or initiative referenced: "${c.technology_context}"` : "No security hiring signal detected",
    c.security_hiring_signal ? "high" : "n/a", "enrichment.security_hiring_signal");

  push("Geographic expansion", c.geographic_expansion_signal,
    c.geographic_expansion_signal ? `Operating across ${c.countries_of_operation.length} countries: ${c.countries_of_operation.join(", ")}` : "Single-country footprint",
    c.geographic_expansion_signal ? "medium" : "n/a", "enrichment.countries_of_operation");

  const growthPct = parseGrowth(c.estimated_growth);
  push("Rapid headcount growth", growthPct !== null && growthPct >= 15,
    growthPct !== null ? `Estimated growth: ${c.estimated_growth}` : "Growth not reported",
    growthPct !== null ? (growthPct >= 25 ? "high" : "medium") : "n/a", "enrichment.estimated_growth");

  push("Multiple offices or countries", c.countries_of_operation.length > 1,
    `${c.countries_of_operation.length} countries of operation on file`,
    c.countries_of_operation.length > 1 ? "high" : "n/a", "enrichment.countries_of_operation");

  return signals;
}

function parseGrowth(str) {
  const m = /(-)?\+?(\d+)%/.exec(str || "");
  if (!m) return null;
  const n = parseInt(m[2], 10);
  return m[1] ? -n : n;
}

// ---------------------------------------------------------------------------
// PHASE 4 — ICP SCORING (deterministic — the LLM never sets this)
// ---------------------------------------------------------------------------
function scoreAccount(c, signals) {
  const w = ICP_CONFIG.weights;
  const notes = [];
  let fit = 0;

  if (c.employee_count >= ICP_CONFIG.headcount_min && c.employee_count <= ICP_CONFIG.headcount_max) { fit += w.company_fit.headcount_band; notes.push(`+${w.company_fit.headcount_band} headcount in ${ICP_CONFIG.headcount_min}–${ICP_CONFIG.headcount_max} band (${c.employee_count})`); }
  else notes.push(`+0 headcount outside ${ICP_CONFIG.headcount_min}–${ICP_CONFIG.headcount_max} band (${c.employee_count})`);

  if (ICP_CONFIG.target_industries.includes(c.industry)) { fit += w.company_fit.relevant_profile; notes.push(`+${w.company_fit.relevant_profile} B2B/modern-workforce profile (${c.industry})`); }
  else notes.push(`+0 industry profile not a strong match (${c.industry})`);

  if (c.countries_of_operation.length > 1) { fit += w.company_fit.multi_location; notes.push(`+${w.company_fit.multi_location} multi-location (${c.countries_of_operation.length} countries)`); }
  else notes.push(`+0 single location`);

  const relevantGeo = c.countries_of_operation.some(g => ICP_CONFIG.target_geos.includes(g));
  if (relevantGeo) { fit += w.company_fit.relevant_geo; notes.push(`+${w.company_fit.relevant_geo} relevant geography`); }
  else notes.push(`+0 geography not in target list`);

  let sig = 0;
  const has = n => signals.find(s => s.signal_name === n)?.detected;
  if (has("IT hiring") || has("Cybersecurity / IAM hiring")) { sig += w.signals.it_security_hiring; notes.push(`+${w.signals.it_security_hiring} IT/security hiring signal detected`); }
  else notes.push(`+0 no IT/security hiring signal`);

  if (has("Remote or distributed workforce")) { sig += w.signals.remote_hybrid; notes.push(`+${w.signals.remote_hybrid} remote/hybrid workforce`); }
  else notes.push(`+0 not remote/hybrid`);

  if (has("Rapid headcount growth")) { sig += w.signals.growing_headcount; notes.push(`+${w.signals.growing_headcount} growing headcount`); }
  else notes.push(`+0 headcount not growing`);

  if (has("Geographic expansion")) { sig += w.signals.geo_expansion; notes.push(`+${w.signals.geo_expansion} geographic expansion`); }
  else notes.push(`+0 no geographic expansion`);

  let contact = 0;
  const hasContact = c.contact.name !== "unknown";
  const relevantTitle = /IT|Security|CIO|Identity|Access/i.test(c.contact.title || "");
  if (hasContact && relevantTitle) { contact += w.contact.relevant_decision_maker; notes.push(`+${w.contact.relevant_decision_maker} relevant IT/security decision maker identified`); }
  else notes.push(`+0 no confirmed relevant decision maker`);
  if (c.contact.email !== "unknown") { contact += w.contact.contact_available; notes.push(`+${w.contact.contact_available} contact info available`); }
  else notes.push(`+0 no contact info on file`);
  if (hasContact && relevantTitle && c.contact.confidence === "high") { contact += w.contact.responsibilities_match; notes.push(`+${w.contact.responsibilities_match} responsibilities match likely pain area`); }
  else notes.push(`+0 responsibilities match unconfirmed`);

  const total = fit + sig + contact;
  const tier = total >= ICP_CONFIG.tierA_threshold ? "A" : total >= ICP_CONFIG.tierB_threshold ? "B" : "C";

  return { total_score: total, company_fit_score: fit, signal_score: sig, contact_score: contact, tier, score_explanation: notes };
}

// ---------------------------------------------------------------------------
// PHASE 6 — PERSONA IDENTIFICATION
// ---------------------------------------------------------------------------
function identifyPersona(c, signals) {
  let persona = "Director of IT";
  let reason = "Default IT decision-maker persona for a company this size.";
  if (signals.find(s => s.signal_name === "Cybersecurity / IAM hiring")?.detected) {
    persona = c.employee_count > 500 ? "CIO / VP IT (security-adjacent)" : "IT Operations Director";
    reason = "Active security/IAM hiring signal indicates identity and access management is already a budgeted priority.";
  } else if (c.employee_count > 600) {
    persona = "VP IT";
    reason = "Company size suggests IT decisions route through a VP-level owner rather than a single admin.";
  } else if (signals.find(s => s.signal_name === "Remote or distributed workforce")?.detected) {
    persona = "Head of IT";
    reason = "Distributed workforce puts device/identity ownership on a centralized IT lead.";
  }
  return {
    persona,
    reason_persona_is_relevant: reason,
    contact_name: c.contact.name,
    contact_title: c.contact.title,
    contact_email: c.contact.email,
    contact_confidence: c.contact.confidence
  };
}

// ---------------------------------------------------------------------------
// PHASE 5 — AI REASONING (structured JSON)
// DEMO NOTE: this function is a deterministic stand-in that returns the exact
// schema an OpenAI API call would return. It never sets icp_score or tier —
// those are passed in from the deterministic scorer. From an account's
// detail page, a viewer can optionally replace this output for one account
// with a real call to the OpenAI API (see callOpenAILive below); the JSON
// shape is identical either way, so nothing downstream needs to change.
// ---------------------------------------------------------------------------
function generateAIReasoning(c, signals, score) {
  const detected = signals.filter(s => s.detected);
  const primary = detected.sort((a, b) => (b.confidence === "high") - (a.confidence === "high"))[0];
  const secondary = detected.filter(s => s !== primary).map(s => s.signal_name);
  const missing = [];
  if (c.contact.name === "unknown") missing.push("confirmed IT/security decision-maker contact");
  if (c.estimated_growth === "unknown") missing.push("headcount growth trend");
  if (c.technology_context === "unknown") missing.push("current identity/device management stack");

  let painHypothesis, reasonNow;
  if (primary?.signal_name.includes("hiring")) {
    painHypothesis = `INFERENCE: the open IT/security role suggests ${c.company_name} is currently under-resourced to manage identity and device access at its current headcount — this is a plausible read of the hiring signal, not a confirmed pain point.`;
    reasonNow = "A live hiring signal means budget and mandate likely already exist — outreach timed to a hiring window has a materially better chance of reaching someone with an active mandate.";
  } else if (primary?.signal_name.includes("remote") || primary?.signal_name.includes("Remote")) {
    painHypothesis = `INFERENCE: a distributed workforce without a confirmed unified identity layer (${c.technology_context}) raises the likelihood of fragmented device and access management — inferred from the workforce structure, not verified directly.`;
    reasonNow = "Distributed-workforce companies without a named identity vendor are in-market more often than steady-state on-prem shops.";
  } else if (primary?.signal_name.includes("expansion") || primary?.signal_name.includes("countries")) {
    painHypothesis = `INFERENCE: expanding into ${c.countries_of_operation.length} countries typically forces a re-evaluation of identity and device policy to stay consistent across regions — this is a category-level pattern, not a confirmed statement from ${c.company_name}.`;
    reasonNow = "Expansion phases are a known trigger point where IT re-evaluates its identity stack before scale makes migration harder.";
  } else {
    painHypothesis = `FACT: no strong buying signal was detected for ${c.company_name} in this dataset; any pain hypothesis here would be speculative.`;
    reasonNow = "Insufficient signal strength to justify a timing-based outreach angle right now.";
  }

  return {
    icp_score: score.total_score,
    tier: score.tier,
    primary_signal: primary ? primary.signal_name : "none detected",
    secondary_signals: secondary,
    pain_hypothesis: painHypothesis,
    recommended_persona: identifyPersona(c, signals).persona,
    reason_to_contact_now: reasonNow,
    outreach_angle: primary ? `Lead with the ${primary.signal_name.toLowerCase()} signal, tie it to identity/device sprawl risk, offer a scoped conversation — not a demo pitch.` : "Insufficient signal to justify outreach; hold for nurture.",
    confidence: detected.length >= 3 ? "high" : detected.length >= 1 ? "medium" : "low",
    missing_information: missing,
    source: "simulated"
  };
}

// ---------------------------------------------------------------------------
// PHASE 7 — PERSONALIZED OUTREACH (<= ~80 words)
// ---------------------------------------------------------------------------
function generateOutreach(c, signals, reasoning, persona) {
  const primary = reasoning.primary_signal;
  const evidence = signals.find(s => s.signal_name === primary)?.evidence || "";
  if (reasoning.confidence === "low") {
    return { subject_line: "(hold — insufficient signal)", opening_line: "—", message: "Not enough evidence to justify a personalized outreach angle for this account yet — recommend nurture over outbound.", call_to_action: "—", evidence_used: "none" };
  }
  const subject = `${c.company_name}: identity/device question`;
  const opening = `Noticed ${c.company_name} ${primary.toLowerCase().includes("hiring") ? "has an open IT/security req" : primary.toLowerCase().includes("remote") ? "runs a distributed team" : "is expanding across " + c.countries_of_operation.join("/")}.`;
  const message = `${opening} Teams in that spot often end up managing devices and access across too many disconnected tools once headcount or geography outpaces the original setup. Curious whether that's on ${persona.persona.toLowerCase()}'s radar at ${c.company_name} right now, or if it's already handled.`;
  const cta = "Worth a 15-minute conversation to compare notes?";
  return { subject_line: subject, opening_line: opening, message, call_to_action: cta, evidence_used: evidence };
}

// ---------------------------------------------------------------------------
// PHASE 7b — SEQUENCE (Tier A only) + FEEDBACK LOOP RULES
// Mirrors the "sourcing → contact → research → priority → personalization →
// sequencing → engagement orchestration" flow the role description asks for.
// ---------------------------------------------------------------------------
function buildSequence(c, signals, reasoning, persona) {
  const primary = reasoning.primary_signal;
  const growthOrItAngle = (primary.toLowerCase().includes("hiring") || primary.toLowerCase().includes("growth"))
    ? `Growth/leadership signal: ${primary.toLowerCase()}` : `Primary signal: ${primary.toLowerCase()}`;
  return {
    steps: [
      { day: 1, channel: "Email", description: `${growthOrItAngle} — opening email personalized from ${persona.persona}'s likely priority.` },
      { day: 3, channel: "LinkedIn", description: "Short connection note referencing the same signal, no pitch." },
      { day: 6, channel: "Email", description: "Second email, different angle — identity/device sprawl risk framed around headcount or geography growth." },
      { day: 10, channel: "Final touch", description: "Security/device-management insight (breach cost, audit friction, or compliance angle) as a break-up-style final message." }
    ],
    feedback_rules: [
      { trigger: "Positive reply", action: "Stop all automation immediately — BDR takes the conversation." },
      { trigger: "Meeting booked", action: "Suppress all remaining automated outreach for this account." },
      { trigger: "No response after full sequence", action: "Pause outreach until a new signal is detected." },
      { trigger: "Not interested", action: "Suppress account / move to long-cycle nurture." }
    ]
  };
}

// ---------------------------------------------------------------------------
// PHASE 8 — ROUTING ENGINE (deterministic, logged)
// Routing depends on score AND evidence sufficiency AND contact readiness —
// a high score with no named contact is a data-enrichment problem, not a
// BDR-ready account.
// ---------------------------------------------------------------------------
function routeAccount(c, signals, score) {
  const detectedCount = signals.filter(s => s.detected).length;
  const hasSufficientEvidence = detectedCount >= ICP_CONFIG.min_signals_for_evidence;
  const hasContact = c.contact.name !== "unknown" && c.contact.email !== "unknown";

  if (score.tier === "A") {
    if (hasSufficientEvidence && hasContact) {
      return { action: "Route to BDR", crm_status: "Synced to CRM · HIGH PRIORITY", queue: "BDR — immediate", reason: `Score ${score.total_score} ≥ ${ICP_CONFIG.tierA_threshold}, ${detectedCount} signals detected, contact identified.` };
    }
    if (!hasContact) {
      return { action: "Contact enrichment", crm_status: "Synced to CRM · needs contact", queue: "Enrichment queue", reason: `Score ${score.total_score} ≥ ${ICP_CONFIG.tierA_threshold} but no confirmed decision-maker contact on file — route to enrichment before BDR.` };
    }
    return { action: "Nurture / research", crm_status: "Synced to CRM · nurture", queue: "Marketing nurture", reason: `Score ${score.total_score} ≥ ${ICP_CONFIG.tierA_threshold} but only ${detectedCount} signal(s) detected — below the ${ICP_CONFIG.min_signals_for_evidence}-signal evidence bar for a BDR handoff.` };
  }
  if (score.tier === "B") {
    return { action: "Nurture / research", crm_status: "Synced to CRM · nurture", queue: "Marketing nurture", reason: `Score ${score.total_score} in the ${ICP_CONFIG.tierB_threshold}–${ICP_CONFIG.tierA_threshold - 1} band.` };
  }
  return { action: "Suppress", crm_status: "Not synced", queue: "None", reason: `Score ${score.total_score} below ${ICP_CONFIG.tierB_threshold}.` };
}

function routeTagClass(action) {
  if (action === "Route to BDR") return "route-bdr";
  if (action === "Contact enrichment") return "route-enrich";
  if (action === "Nurture / research") return "route-nurture";
  return "route-suppress";
}

// ---------------------------------------------------------------------------
// "Why JumpCloud?" — connects enrichment attributes to the actual product
// (unified identity + device + access), not a generic value prop.
// ---------------------------------------------------------------------------
function buildWhyJumpCloud(c, signals) {
  const reasons = [];
  if (/mac|windows|linux/i.test(c.technology_context) || /mixed/i.test(c.technology_context)) {
    reasons.push({ attr: "Mixed-OS fleet", link: "Unified device management across Mac/Windows/Linux instead of per-OS tooling." });
  }
  if (c.countries_of_operation.length > 1) {
    reasons.push({ attr: `Operates in ${c.countries_of_operation.length} countries`, link: "Single identity provider avoids per-region IAM sprawl as they scale internationally." });
  }
  if (signals.find(s => s.signal_name === "Remote or distributed workforce")?.detected) {
    reasons.push({ attr: "Remote/hybrid workforce", link: "Cloud directory + device trust replaces on-prem AD/VPN assumptions that don't hold for distributed teams." });
  }
  if (signals.find(s => s.signal_name === "Cybersecurity / IAM hiring")?.detected) {
    reasons.push({ attr: "Actively hiring for security/IAM", link: "A newly budgeted security hire is a natural buyer for a unified identity + access platform instead of stitching point solutions." });
  }
  if (signals.find(s => s.signal_name === "Rapid headcount growth")?.detected) {
    reasons.push({ attr: "Fast headcount growth", link: "Growing headcount without unified onboarding/offboarding across identity + devices is where access sprawl and orphaned accounts start." });
  }
  if (reasons.length === 0) {
    reasons.push({ attr: "No strong fit signal detected", link: "Not enough evidence yet to draw a credible connection to JumpCloud's product — hold for more enrichment rather than force an angle." });
  }
  return reasons;
}

// ---------------------------------------------------------------------------
// PHASE 13 — QA CHECK (deterministic claim verification)
// Verifies the generated outreach doesn't say anything the evidence engine
// didn't actually detect. This is the "QA Agent" step from a governance
// standpoint, but it's implemented here as a plain deterministic check —
// not a model call — because verifying "does this claim trace to a citation"
// is exactly the kind of thing that should be reproducible, not sampled.
// ---------------------------------------------------------------------------
function qaCheckOutreach(signals, outreach, reasoning) {
  if (reasoning.confidence === "low") {
    return { passed: true, note: "Outreach correctly held back — insufficient signal to justify a claim either way." };
  }
  const citedEvidence = signals.find(s => s.detected && s.evidence === outreach.evidence_used);
  if (!citedEvidence) {
    return { passed: false, note: "Outreach evidence_used does not match any detected signal's citation — would have blocked send." };
  }
  return { passed: true, note: `Every claim in the outreach traces to a detected signal ("${citedEvidence.signal_name}", source: ${citedEvidence.source}).` };
}

// ---------------------------------------------------------------------------
// PHASE 14 — AGENT RUN TRACE
// A step-by-step execution trace for the account detail page's "Agent Run"
// panel. Each step is labeled ENGINE (deterministic code), AGENT (the one
// place a model's output can flow through), or GATE (a branch point) — never
// blurred together, so the trace itself demonstrates the same principle the
// rest of this demo argues for: AI where reasoning helps, deterministic
// logic where consistency matters. Step order mirrors buildAccountRecord()
// exactly; there's no separate simulation of the pipeline. The step list
// runs in a fixed sequence in the browser (not over real network time), so
// this trace shows order and outcome, not real per-step latency.
// ---------------------------------------------------------------------------
const LIVE_REASONING_OVERRIDES = {}; // accountId -> reasoning object from OpenAI
const LIVE_REASONING_META = {}; // accountId -> { model, tokens, latency_ms, estimated_cost_usd }
let LIVE_AI_SPEND_USD = 0;
let LIVE_AI_CALL_COUNT = 0;

function buildAgentRun(c, signals, score, reasoning, persona, outreach, qa, routing) {
  const detectedCount = signals.filter(s => s.detected).length;
  const steps = [
    { type: "engine", name: "Enrichment", detail: `Loaded Clay snapshot for ${c.company_name} (fetched ${c.last_enriched}) — ${c.countries_of_operation.length} countries on file.` },
    { type: "engine", name: "Signal Detection", detail: `${detectedCount} of ${signals.length} candidate signals detected.` },
    { type: "engine", name: "ICP Scoring", detail: `Score ${score.total_score}/100 → Tier ${score.tier}.` },
    { type: "gate", name: "Qualification Gate", detail: score.tier === "C" ? "Score below the Tier B threshold — this account doesn't clear the bar to justify reasoning, persona work or outreach; the trace stops here." : "Score clears the gate — continuing to AI Reasoning." }
  ];
  if (score.tier !== "C") {
    steps.push({ type: "agent", name: "AI Reasoning", confidence: reasoning.confidence, detail: reasoning.source === "live_openai" ? `Live OpenAI API call (server-side key)${LIVE_REASONING_META[c.id] ? ` — ${LIVE_REASONING_META[c.id].total_tokens} tokens, ${LIVE_REASONING_META[c.id].latency_ms}ms, ~$${LIVE_REASONING_META[c.id].estimated_cost_usd.toFixed(6)}` : ""}.` : "Deterministic simulator — returns the exact JSON shape an OpenAI call would produce." });
    steps.push({ type: "engine", name: "Persona Selection", detail: `Selected: ${persona.persona}.` });
    steps.push({ type: "engine", name: "Outreach Templating", detail: reasoning.confidence === "low" ? "Held — insufficient signal to draft outreach." : "Generated from the primary cited signal." });
    steps.push({ type: "engine", name: "QA Check", detail: qa.note, failed: !qa.passed });
  }
  steps.push({ type: "engine", name: "Routing", detail: `${routing.action} — ${routing.reason}` });
  steps.push({ type: "gate", name: "Human Approval", detail: routing.action === "Route to BDR" ? "Required before any outreach send or CRM write — see Governance in Architecture." : "Not applicable — this account was not routed to BDR." });
  return steps;
}

// ---------------------------------------------------------------------------
// PHASE 12 — PIPELINE: build the full auditable record per account
// ---------------------------------------------------------------------------
function buildAccountRecord(c) {
  const signals = detectSignals(c);
  const score = scoreAccount(c, signals);
  const persona = identifyPersona(c, signals);
  const reasoning = generateAIReasoning(c, signals, score);
  const outreach = generateOutreach(c, signals, reasoning, persona);
  const qa = qaCheckOutreach(signals, outreach, reasoning);
  const routing = routeAccount(c, signals, score);
  const sequence = buildSequence(c, signals, reasoning, persona);
  const whyJumpCloud = buildWhyJumpCloud(c, signals);
  const agentRun = buildAgentRun(c, signals, score, reasoning, persona, outreach, qa, routing);
  return {
    raw_input: { company_name: c.company_name, website: c.website },
    enriched: c,
    signals,
    score,
    persona,
    ai_reasoning: reasoning,
    outreach,
    qa,
    routing,
    sequence,
    whyJumpCloud,
    agentRun,
    timestamp: new Date().toISOString()
  };
}

let ACCOUNTS = COMPANIES.map(buildAccountRecord);
let ROUTING_LOG = buildRoutingLog();
function buildRoutingLog() {
  return ACCOUNTS.map(a => ({
    company_name: a.enriched.company_name,
    score: a.score.total_score,
    tier: a.score.tier,
    action: a.routing.action,
    reason: a.routing.reason,
    crm_status: a.routing.crm_status,
    timestamp: a.timestamp
  }));
}

function recomputePipeline() {
  ACCOUNTS = COMPANIES.map(buildAccountRecord);
  ROUTING_LOG = buildRoutingLog();
}

// ---------------------------------------------------------------------------
// OPTIONAL — live OpenAI call for AI Research & Reasoning on a single account.
// Runs server-side via a Netlify Function (netlify/functions/ai-reasoning.mjs)
// holding the site owner's OPENAI_API_KEY — no visitor credential needed.
// Scoring/routing are untouched — only ai_reasoning (and the outreach copy
// derived from it) is replaced. The function returns real token usage,
// latency and an estimated cost, tracked here for the Agent Run trace and
// the Outcomes page's running AI-spend total.
// ---------------------------------------------------------------------------
async function callOpenAILive(c, signals, score) {
  const res = await fetch("/.netlify/functions/ai-reasoning", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      company: { name: c.company_name, industry: c.industry, employee_count: c.employee_count,
        countries_of_operation: c.countries_of_operation, estimated_growth: c.estimated_growth,
        technology_context: c.technology_context },
      detected_signals: signals.filter(s => s.detected).map(s => ({ name: s.signal_name, evidence: s.evidence, confidence: s.confidence })),
      icp_score: score.total_score, tier: score.tier
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Backend error ${res.status}`);
  return data; // { reasoning, meta }
}

// private-app token, used only for a direct browser request to that one

let ZAPIER_WEBHOOK_URL = "";
let HUBSPOT_TOKEN = "";
const LIVE_ORCHESTRATION_FIRED = {}; // accountId -> { zapier: bool, hubspot: bool }

async function fireZapierWebhook(c, a) {

    })

async function createHubspotContactAndDeal(c, a) {
  const contactRes = await fetch("https://api.hubapi.com/crm/v3/objects/contacts", {
    method: "POST",
    headers: { "content-type": "application/json", "authorization": `Bearer ${HUBSPOT_TOKEN}` },
    body: JSON.stringify({
      properties: {
        firstname: a.persona.contact_name !== "unknown" ? a.persona.contact_name.split(" ")[0] : "Unknown",
        lastname: a.persona.contact_name !== "unknown" ? a.persona.contact_name.split(" ").slice(1).join(" ") || "Contact" : "Contact",
        jobtitle: a.persona.contact_title, company: c.company_name, website: c.website
      }
    })
  });
  if (!contactRes.ok) {
    const errText = await contactRes.text().catch(() => "");
    throw new Error(`HubSpot contact create failed (${contactRes.status}): ${errText.slice(0, 200)}`);
  }
  const contact = await contactRes.json();

  const dealRes = await fetch("https://api.hubapi.com/crm/v3/objects/deals", {
    method: "POST",
    headers: { "content-type": "application/json", "authorization": `Bearer ${HUBSPOT_TOKEN}` },
    body: JSON.stringify({
      properties: {
        dealname: `${c.company_name} — GTM AI Outbound Engine (score ${a.score.total_score}, tier ${a.score.tier})`,
        dealstage: "appointmentscheduled", pipeline: "default"
      },
      associations: [{ to: { id: contact.id }, types: [{ associationCategory: "HUBSPOT_DEFINED", associationTypeId: 3 }] }]
    })
  });
  if (!dealRes.ok) {
    const errText = await dealRes.text().catch(() => "");
    throw new Error(`HubSpot deal create failed (${dealRes.status}): ${errText.slice(0, 200)} (contact ${contact.id} was created)`);
  }
  return { contactId: contact.id };
}

// ---------------------------------------------------------------------------
// "Ask about this account" — a deterministic Q&A over data this pipeline
// already computed for the account. This is pattern-matching over already-
// real data, not a new model call — it never invents a fact that isn't
// already in the account record. If the viewer has activated live OpenAI
// reasoning for this account (see the panel below), answers about "why now"
// / "pain hypothesis" reflect that live output instead of the simulator,
// same as everywhere else in this page.
// ---------------------------------------------------------------------------
const SUGGESTED_QUESTIONS = [
  "Why is this account prioritized?",
  "Why now?",
  "What tools can the agent use here?",
  "What would move this to Tier A?",
  "What's the biggest risk of being wrong here?"
];

function nextTierHint(a) {
  if (a.score.tier === "A") return "Already Tier A — nothing further needed to clear the routing gate.";
  const gaps = a.score.score_explanation.filter(n => n.startsWith("+0"));
  if (gaps.length === 0) return "No scoring gaps left to close — the remaining points would come from a policy change (see ICP Config), not new evidence.";
  const nextTier = a.score.tier === "B" ? "A" : "B";
  const target = nextTier === "A" ? ICP_CONFIG.tierA_threshold : ICP_CONFIG.tierB_threshold;
  const pointsNeeded = target - a.score.total_score;
  const prefix = a.score.tier === "C" ? `This account isn't Tier A material yet — it would need to clear Tier B first. ` : "";
  return `${prefix}${pointsNeeded} more point${pointsNeeded === 1 ? "" : "s"} would reach Tier ${nextTier} (score ${a.score.total_score} → ${target}). Open gaps today: ${gaps.slice(0, 3).map(g => g.replace(/^\+0\s*/, "")).join("; ")}.`;
}

function answerAgentQuestion(c, a, q, reasoning) {
  const ql = q.toLowerCase();
  if (/why.*(priorit|account\??$)|priorit/.test(ql)) {
    return `Score ${a.score.total_score}/100 (Tier ${a.score.tier}) — deterministic, from company fit (${a.score.company_fit_score}/40) + buying signals (${a.score.signal_score}/40) + contact quality (${a.score.contact_score}/20). See Score breakdown for the full line-by-line math.`;
  }
  if (/why now|timing/.test(ql)) {
    return a.score.tier === "C" ? "No timing signal strong enough to act on yet — this account didn't clear the qualification gate, so no reasoning step ran on it." : reasoning.reason_to_contact_now;
  }
  if (/tool|access|permission|mcp/.test(ql)) {
    return `This account can only be touched through the documented MCP surface: search_account, get_account_score, qualify_account and list_high_priority_accounts are READ ONLY. The one write tool, route_account, requires human approval before it fires — it cannot set a routing action inconsistent with this account's actual score. Full contract is in Architecture → MCP tool surface.`;
  }
  if (/tier a|move.*tier|what would|improve|threshold/.test(ql)) {
    return nextTierHint(a);
  }
  if (/risk|wrong|fail|confidence/.test(ql)) {
    const staleSignal = a.signals.find(s => s.detected && s.freshness_days > 30);
    const base = `AI confidence on this account: ${reasoning.confidence}. `;
    return base + (staleSignal
      ? `Biggest concrete risk: the "${staleSignal.signal_name}" signal is ${staleSignal.freshness_days} days old — it could be stale by the time a seller acts on it. This demo re-enriches on a snapshot basis, not continuously.`
      : `Biggest general risk for this system: unsupported personalization — outreach claiming something the evidence doesn't support. That's exactly what the QA check below exists to catch before anything is shown.`);
  }
  if (/person|contact|who/.test(ql)) {
    return a.persona.contact_name !== "unknown"
      ? `${a.persona.contact_name}, ${a.persona.contact_title} — ${a.persona.reason_persona_is_relevant}`
      : `No confirmed contact yet. Recommended persona: ${a.persona.persona} — ${a.persona.reason_persona_is_relevant}`;
  }
  if (/route|bdr|crm|approv/.test(ql)) {
    return `${a.routing.action} — ${a.routing.reason} Any CRM write or outreach send from here still requires a human to click through the Live Orchestration panel; nothing fires automatically.`;
  }
  return `Not sure how to answer that one from this account's data. Try: ${SUGGESTED_QUESTIONS.filter(s => s.toLowerCase() !== ql).slice(0, 3).join(" / ")}`;
}

        backendStatus.textContent = "Failed: " + err.message + " — this function only exists once deployed with Netlify Functions enabled; it 404s on older deployments or when run from public/index.html directly.";
        backendStatus.className = "claude-status err";
      }
    });
  }

  const askFeed = wrap.querySelector("#ask-feed");
  const askInput = wrap.querySelector("#ask-input");
  function askQuestion(q) {
    if (!q.trim()) return;
    const turn = el(`<div class="ask-turn"><div class="q">${esc(q)}</div><div class="a">${esc(answerAgentQuestion(c, a, q, r))}</div></div>`);
    askFeed.appendChild(turn);
    askInput.value = "";
  }
  wrap.querySelector("#ask-btn").addEventListener("click", () => askQuestion(askInput.value));
  askInput.addEventListener("keydown", (e) => { if (e.key === "Enter") askQuestion(askInput.value); });
  wrap.querySelectorAll("#ask-chips .ask-chip").forEach(chip => chip.addEventListener("click", () => askQuestion(chip.dataset.q)));

  return wrap;
}
function renderInference(text) {
  const m = /^(FACT|INFERENCE):\s*(.*)$/s.exec(text);
  if (!m) return esc(text);
  return `<span class="inference-tag ${m[1]}">${m[1]}</span>${esc(m[2])}`;
}
function fieldRow(k, v) { return `<div class="field-row"><span class="k">${esc(k)}</span><span class="val">${esc(v)}</span></div>`; }
function scoreBar(label, val, max) {

      <div class="panel-head"><h2>Trigger-based outbound: dynamic re-prioritization</h2><span class="hint">event → agent run, not a static database</span></div>
      <div class="body-pad">
        <p style="margin:0 0 4px;font-size:13.5px;color:var(--muted)">Scoring in this demo runs once, against a single Clay snapshot. In production the same engine re-runs whenever a signal changes — a tier is a live output, not a label an account keeps forever. Illustrative example, not a real event that fired:</p>
        <div class="mini-flow">
          <div class="mf-node">New signal detected — PostHog opens 3 Security roles</div><div class="mf-arrow">→</div>
          <div class="mf-node">Signal Agent updates the account record</div><div class="mf-arrow">→</div>
          <div class="mf-node">Qualification engine recomputes: 72 → 82</div><div class="mf-arrow">→</div>
          <div class="mf-node">Tier B → Tier A</div><div class="mf-arrow">→</div>
          <div class="mf-node">Contact enrichment + research agents activate</div><div class="mf-arrow">→</div>
          <div class="mf-node">Draft generated, held for human approval</div>
        </div>
        <p style="margin:8px 0 0;font-size:13.5px;color:var(--muted)">The question a signal-driven system answers isn't <em>"could this account buy?"</em> — it's <strong>"why this account, and why now?"</strong> The scoring engine and gate already in this demo (see Pipeline above) are what make that re-run cheap enough to trigger on every signal change instead of on a quarterly refresh.</p>
      </div>
    </div>

    <div class="panel">

            <tr>
              <td>Signals &amp; scoring</td>
              <td><span class="live-dot"></span>Deterministic engine, fully live</td>

            </tr>
            <tr>
              <td>AI reasoning</td>

            </tr>
            <tr>

            <tr>

    <div class="panel">

        Every row above marked <span class="live-dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin:0 2px"></span> is one click away, on any account's detail page — not just described here.

    </div>

    <div class="panel">
      <div class="panel-head"><h2>MCP tool surface</h2><span class="hint">permissions, contracts, and human-approval gates</span></div>
      <div class="body-pad">
        <p style="margin:0 0 12px;color:var(--muted);font-size:13px">LLM / Agent → MCP Client → MCP Server → GTM tools → application data. Documented here as a designed contract — read tools would run against this demo's in-memory data if wired up; the one write tool is deliberately gated.</p>
        ${MCP_TOOLS.map(t => `
          <div class="mcp-tool">
            <div class="mcp-tool-head">
              <span class="tname">${esc(t.name)}</span>

          <span class="dot">🟢</span>
          <div><div class="label">Auto-execute — no review needed</div><div class="items">Save enrichment snapshot · calculate ICP score · detect signals · update the routing log</div></div>

  const psNodes = wrap.querySelectorAll(".ps-node");
  const psDetail = wrap.querySelector("#pipeline-detail");
  function renderPsDetail(i) {
    const s = PIPELINE_FLOW[i];
    psDetail.innerHTML = `
      <span class="fc-badge ${s.type}">${s.type.toUpperCase()}</span>
      <div><h4>${esc(s.name)}</h4><p>${esc(s.detail)}</p>${s.branch ? `<div class="ps-branch">↳ ${esc(s.branch)}</div>` : ''}</div>`;
  }
  psNodes.forEach(btn => btn.addEventListener("click", () => {
    psNodes.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderPsDetail(Number(btn.dataset.i));
  }));
  renderPsDetail(0);

  return wrap;
}
