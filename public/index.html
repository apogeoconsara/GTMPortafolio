/* ---------------------------------------------------------------- AI OPS CONSOLE (SALESFORCE-ORIENTED) */
// GTM AI Operations console: "Which accounts should I prioritize this
// week?" answered from CRM-shaped data (Account/Contact/Opportunity/Task),
// via netlify/functions/gtm-ops-agent.mjs.
//
// Salesforce is the intended system of record; this UI is an intelligence/
// orchestration layer on top of it. Today there is no Salesforce MCP
// connector configured (see _crm_connector.mjs), so every record here is
// LOCAL SYNTHETIC DATA — labeled as such everywhere, never presented as if
// it came from a real CRM. Swapping in a real Salesforce connector later
// only requires implementing _crm_connector.mjs; nothing here changes.
//
// Safety by construction, not by a toggle a developer could forget to
// check: there is no send-email/message/sequence tool defined anywhere in
// gtm-ops-agent.mjs, so the model has nothing "dangerous" it could call
// even if it wanted to. The one write-shaped tool (propose_crm_action) only
// ever returns a proposal; confirm-crm-action.mjs is the sole place an
// action could execute, and it defaults to dry-run (ALLOW_SALESFORCE_WRITES
// unset) and only ever allows Task/Note.
const OPS_DEFAULT_QUESTION = "Which accounts should I prioritize this week?";

const OPS_STATE = {
  status: "idle",       // idle | loading | error
  error: null,
  question: OPS_DEFAULT_QUESTION,
  messages: [],
  turns: [],              // { role: "user"|"assistant", text, updatedRanking }[] — the visible chat log
  ranking: [],
  trace: [],              // { step, tool, detail }[] from the agent's own reasoning loop (which tool it picked, and why)
  traceOpen: false,
  dataSource: null,
  pendingApproval: null,  // { tool_use_id, input: { accountId, actionType, ... } }
  heldToolResults: [],
  proposals: {},          // accountId -> { input, result } once resolved (approved or rejected)
  evidenceOpen: {},        // accountId -> bool
  hasAsked: false,
  autoChainedFor: null,    // accountId already auto-chained into a proposed action, so it only fires once
  dailyDigestMode: false,  // true once "Run Daily Digest" has been used this session
};

// Simulates the production design described in Architecture: a scheduled
// job (e.g. a daily cron-triggered Netlify Function) runs this same
// prioritization reasoning every morning and drafts a Gmail message per
// account for the seller to review — never sends automatically. This
// button runs the real reasoning loop live; only the "arrives in your
// Gmail every morning" delivery mechanism is simulated, and labeled as such.
function opsRunDailyDigest() {
  OPS_STATE.dailyDigestMode = true;
  opsAsk(OPS_DEFAULT_QUESTION);
}

function opsToggleTrace() {
  OPS_STATE.traceOpen = !OPS_STATE.traceOpen;
  render();
}

async function opsAsk(question, opts) {
  const q = (question || "").trim();
  if (!q || OPS_STATE.status === "loading" || OPS_STATE.pendingApproval) return;
  const autonomous = Boolean(opts && opts.autonomous);

  OPS_STATE.status = "loading";
  OPS_STATE.error = null;
  OPS_STATE.hasAsked = true;
  if (!autonomous) OPS_STATE.turns.push({ role: "user", text: q });
  OPS_STATE.question = "";
  const messagesToSend = [...OPS_STATE.messages, { role: "user", content: q }];
  render();

  try {
    const res = await fetch("/.netlify/functions/gtm-ops-agent", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: messagesToSend }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

    OPS_STATE.messages = data.messages;
    OPS_STATE.dataSource = data.data_source;
    OPS_STATE.trace = OPS_STATE.trace.concat(data.trace || []);
    const gotNewRanking = Boolean(data.ranking && data.ranking.length > 0);
    if (gotNewRanking) {
      OPS_STATE.ranking = data.ranking;
    }

    if (data.pending_approval) {
      OPS_STATE.pendingApproval = data.pending_approval;
      OPS_STATE.heldToolResults = data.held_tool_results || [];
      OPS_STATE.status = "idle";
      OPS_STATE.turns.push({
        role: "assistant",
        text: (autonomous ? "Autonomously " : "") + "Prepared a follow-up action proposal — see below for approval before anything is written to the CRM.",
      });
    } else {
      OPS_STATE.pendingApproval = null;
      OPS_STATE.heldToolResults = [];
      OPS_STATE.status = "idle";
      if (data.limit_reached) {
        OPS_STATE.error = "The agent hit this demo's step limit before finishing. Try asking again.";
      } else {
        const assistantText = gotNewRanking
          ? "Ranked " + data.ranking.length + " account" + (data.ranking.length === 1 ? "" : "s") + " below, evidence-backed. Now autonomously preparing a next-best-action for the top one..."
          : (data.note || "(No response text — try rephrasing your question.)");
        OPS_STATE.turns.push({ role: "assistant", text: assistantText });
      }
    }

    // Autonomous chaining: once a fresh ranking comes back, the agent
    // immediately reasons about the #1 account's next step on its own —
    // no extra click, no extra typed question — and stops only at the
    // human-approval gate above. This only ever fires once per top account
    // so it can't loop on itself.
    if (gotNewRanking && !data.pending_approval && data.ranking[0]) {
      const topId = data.ranking[0].account.Id;
      if (OPS_STATE.autoChainedFor !== topId) {
        OPS_STATE.autoChainedFor = topId;
        render();
        await opsAsk(`Prepare a follow-up action for account ${topId} — you decide Task or Note and the content, based on its evidence.`, { autonomous: true });
        return;
      }
    }
  } catch (err) {
    OPS_STATE.error = err.message;
    OPS_STATE.status = "error";
  }
  render();
}

function opsPrepareAction(accountId) {
  opsAsk(`Prepare a follow-up task for account ${accountId}.`);
}

async function opsResolveApproval(approved) {
  const pending = OPS_STATE.pendingApproval;
  if (!pending) return;
  const accountId = pending.input.accountId;

  OPS_STATE.status = "loading";
  render();

  let confirmResult = { executed: false, status: "REJECTED", message: "You chose not to approve this action — nothing was proposed to Salesforce." };
  if (approved) {
    try {
      const res = await fetch("/.netlify/functions/confirm-crm-action", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ action: pending.input }),
      });
      confirmResult = await res.json();
    } catch (err) {
      confirmResult = { executed: false, status: "ERROR", message: err.message };
    }
  }

  OPS_STATE.proposals[accountId] = { input: pending.input, result: confirmResult };

  const ackResult = { type: "tool_result", tool_use_id: pending.tool_use_id, content: confirmResult.message };
  OPS_STATE.messages = [...OPS_STATE.messages, { role: "user", content: [...OPS_STATE.heldToolResults, ackResult] }];
  OPS_STATE.pendingApproval = null;
  OPS_STATE.heldToolResults = [];
  OPS_STATE.status = "idle";
  render();
}

  const accountId = item.account.Id;

  }

  return `<button class="btn small" data-prepare="${esc(accountId)}" ${OPS_STATE.status === "loading" || OPS_STATE.pendingApproval ? "disabled" : ""}>Prepare action</button>`;

  const doAsk = () => { OPS_STATE.question = input.value; opsAsk(input.value); };
  if (askBtn) askBtn.addEventListener("click", doAsk);
  if (input) input.addEventListener("keydown", (e) => { if (e.key === "Enter") doAsk(); });

  wrap.querySelectorAll("[data-evidence]").forEach((btn) => btn.addEventListener("click", () => opsToggleEvidence(btn.dataset.evidence)));
  wrap.querySelectorAll("[data-prepare]").forEach((btn) => btn.addEventListener("click", () => opsPrepareAction(btn.dataset.prepare)));
  wrap.querySelectorAll("[data-followup]").forEach((btn) => btn.addEventListener("click", () => opsAsk(btn.dataset.question)));
  const traceToggle = wrap.querySelector("#ops-trace-toggle");
  if (traceToggle) traceToggle.addEventListener("click", opsToggleTrace);
  const dailyDigestBtn = wrap.querySelector("#ops-daily-digest-btn");
  if (dailyDigestBtn) dailyDigestBtn.addEventListener("click", opsRunDailyDigest);
  wrap.querySelectorAll("[data-approve]").forEach((btn) => btn.addEventListener("click", () => opsResolveApproval(true)));
  wrap.querySelectorAll("[data-reject]").forEach((btn) => btn.addEventListener("click", () => opsResolveApproval(false)));

  return wrap;
}

/* ---------------------------------------------------------------- INIT */
document.querySelectorAll(".rail nav button").forEach(b => b.addEventListener("click", () => goTo(b.dataset.page)));
render();

</script>
</body>
</html>
