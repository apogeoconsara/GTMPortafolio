<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTM AI Outbound Engine</title>
<style>
/* Design tokens ------------------------------------------------------------
   Light theme — white/near-white ground so it reads as a familiar, modern
   industrial-ops console rather than a dark terminal. Not a verified
   reproduction of Allie's own brand palette (couldn't fetch their site to
   confirm exact hex values) — this is a professional, industrial-adjacent
   teal-green accent chosen to feel at home next to a factory-floor product.
   Color: Ink #F7F8FA (bg), Panel #FFFFFF (surfaces), Line #E2E6EB (borders),
   Text #101828 (primary) / #64748B (muted), Accent #0E8F76 (teal-green),
   Tier B #B45309 (amber), Tier C #64748B (slate)
   Type: "Inter" for headings/nav, "IBM Plex Sans" for everything else —
   no monospace anywhere, including scores, tags, and code-like values.
   Layout: fixed left rail + main content, left-aligned, dense data tables —
   this reads as an internal ops console, not a marketing page.
---------------------------------------------------------------------------- */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root {
  --ink: #F7F8FA;
  --panel: #FFFFFF;
  --panel-2: #F1F3F5;
  --line: #E2E6EB;
  --text: #101828;
  --muted: #64748B;
  --accent: #0E8F76;
  --accent-dim: #E3F5EF;
  --tier-a: #0E8F76;
  --tier-b: #B45309;
  --tier-c: #64748B;
  --good: #16A34A;
  --warn: #B45309;
  --bad: #DC2626;
  --rail-bg: #0B2340;
  --rail-bg-2: #123258;
  --rail-text: #F3F6FA;
  --rail-muted: #93A9C7;
  --rail-line: rgba(255,255,255,.08);
  --font-head: 'Inter', sans-serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Sans', sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
::selection { background: var(--accent-dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; min-height: 100vh; }

/* --- Rail --- */
.rail {
  width: 240px;
  flex-shrink: 0;
  background: var(--rail-bg);
  border-right: 1px solid var(--rail-line);
  padding: 22px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.rail-brand {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.01em;
  margin-bottom: 2px;
  color: var(--rail-text);
}
.rail-sub { color: var(--rail-muted); font-size: 12px; margin-bottom: 14px; }
.rail-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.1); color: #6FE3C4;
  font-family: var(--font-mono); font-size: 11px;
  padding: 4px 8px; border-radius: 4px; margin-bottom: 8px;
}
.rail-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #6FE3C4; }
.rail-badge.live { background: rgba(255,255,255,.1); color: #7BE0A0; }
.rail-badge.live::before { background: #7BE0A0; }
.rail nav { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
.rail nav button {
  all: unset; cursor: pointer;
  color: var(--rail-muted); font-family: var(--font-body); font-size: 13.5px; font-weight: 500;
  padding: 9px 10px; border-radius: 6px; display: flex; align-items: center; gap: 9px;
}
.rail nav button:hover { background: var(--rail-bg-2); color: var(--rail-text); }
.rail nav button.active { background: var(--rail-bg-2); color: var(--rail-text); box-shadow: inset 3px 0 0 var(--accent); }
.rail nav button .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .55; }

/* --- Main --- */
.main { flex: 1; min-width: 0; padding: 30px 40px 60px; max-width: 1180px; }
.page-head { margin-bottom: 26px; }
.page-head h1 { font-family: var(--font-head); font-size: 22px; margin: 0 0 4px; font-weight: 600; }
.page-head p { color: var(--muted); margin: 0; max-width: 680px; }

/* --- KPI grid --- */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 26px; }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 16px 16px 14px;
}
.kpi .v { font-family: var(--font-head); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; margin-top: 4px; }
.kpi .v.tier-a { color: var(--tier-a); }
.kpi .v.tier-b { color: var(--tier-b); }
.kpi .v.tier-c { color: var(--tier-c); }

/* --- Panels / tables --- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 22px; overflow: hidden; }
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px; border-bottom: 1px solid var(--line); gap: 12px; flex-wrap: wrap;
}
.panel-head h2 { font-family: var(--font-head); font-size: 14px; font-weight: 600; margin: 0; }
.panel-head .hint { color: var(--muted); font-size: 12px; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 500; padding: 10px 16px; border-bottom: 1px solid var(--line); }
td { padding: 11px 16px; border-bottom: 1px solid var(--line); font-size: 13.5px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--panel-2); }
.score { font-family: var(--font-body); font-weight: 700; font-variant-numeric: tabular-nums; }

.tier-pill {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 5px;
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
}
.tier-pill.A { background: var(--tier-a); color: #FFFFFF; }
.tier-pill.B { background: var(--tier-b); color: #FFFFFF; }
.tier-pill.C { background: var(--tier-c); color: #FFFFFF; }

.tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; display: inline-block; }
.tag.route-bdr { color: #FFFFFF; background: var(--good); border-color: var(--good); }
.tag.route-enrich { color: #FFFFFF; background: var(--warn); border-color: var(--warn); }
.tag.route-nurture { color: #FFFFFF; background: var(--accent); border-color: var(--accent); }
.tag.route-suppress { color: #FFFFFF; background: var(--bad); border-color: var(--bad); }
.tag.status-success { color: #FFFFFF; background: var(--good); border-color: var(--good); }
.tag.status-failure { color: #FFFFFF; background: var(--bad); border-color: var(--bad); }
.tag.status-retry { color: #FFFFFF; background: var(--warn); border-color: var(--warn); }
.tag.status-historical { color: var(--muted); }

/* --- Detail view --- */
.detail-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
.field-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.field-row:last-child { border-bottom: none; }
.field-row .k { color: var(--muted); }
.field-row .val { text-align: right; max-width: 62%; }
.body-pad { padding: 16px; }
.evidence-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel-2); }
.evidence-card:last-child { margin-bottom: 0; }
.evidence-card .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.evidence-card .name { font-weight: 600; font-size: 13px; }
.evidence-card .name.off { color: var(--muted); font-weight: 500; }
.evidence-card .meta { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.evidence-card .evidence-text { font-family: var(--font-mono); font-size: 12px; color: var(--text); margin-top: 4px; }
.pill-conf { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 6px; border-radius: 4px; }
.pill-conf.high { background: rgba(22,163,74,.16); color: var(--good); }
.pill-conf.medium { background: rgba(180,83,9,.16); color: var(--warn); }
.pill-conf.low, .pill-conf\.n\/a { background: rgba(100,116,139,.2); color: var(--muted); }
.reasoning-block { font-size: 13.5px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.reasoning-block:last-child { border-bottom: none; }
.reasoning-block .k { color: var(--muted); font-size: 11.5px; text-transform: none; margin-bottom: 4px; }
.inference-tag { font-family: var(--font-mono); font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-right: 6px; letter-spacing: .02em; }
.inference-tag.INFERENCE { background: rgba(180,83,9,.18); color: var(--warn); }
.inference-tag.FACT { background: rgba(22,163,74,.16); color: var(--good); }
.outreach-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px; font-size: 13.5px; }
.outreach-card .subj { font-weight: 600; margin-bottom: 8px; }
.back-btn { all: unset; cursor: pointer; color: var(--accent); font-size: 13px; margin-bottom: 16px; display: inline-block; }

.score-bars { display: flex; flex-direction: column; gap: 10px; }
.score-bar-row { }
.score-bar-row .lbl { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
.score-bar-row .lbl .n { font-family: var(--font-body); font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.bar-track { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }

.explain-list { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 12px; }
.explain-list li { padding: 4px 0; color: var(--muted); border-bottom: 1px dashed var(--line); }
.explain-list li:last-child { border-bottom: none; }
.explain-list li.pos { color: var(--good); }

/* --- Architecture --- */
.pipeline-stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ps-node { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer; transition: background .12s, border-color .12s; }
.ps-node:hover { border-color: var(--muted); }
.ps-node .ps-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.ps-node.engine .ps-dot { background: var(--tier-c); }
.ps-node.agent .ps-dot { background: var(--warn); }
.ps-node.gate .ps-dot { background: var(--accent); }
.ps-node.active { color: #fff; border-color: transparent; }
.ps-node.engine.active { background: var(--tier-c); }
.ps-node.agent.active { background: var(--warn); }
.ps-node.gate.active { background: var(--accent); }
.ps-node.active .ps-dot { background: #fff; }
.ps-arrow { color: var(--muted); font-size: 12px; }
.ps-detail { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--panel-2); min-height: 74px; }
.ps-detail h4 { margin: 0 0 4px; font-family: var(--font-head); font-size: 14.5px; font-weight: 600; color: var(--text); }
.ps-detail p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
.ps-detail .ps-branch { margin-top: 6px; color: var(--warn); font-weight: 600; font-size: 12.5px; }
.ps-detail .fc-badge { flex-shrink: 0; font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 20px; margin-top: 2px; }
.ps-detail .fc-badge.engine { background: rgba(100,116,139,.16); color: var(--tier-c); }
.ps-detail .fc-badge.agent { background: rgba(180,83,9,.16); color: var(--warn); }
.ps-detail .fc-badge.gate { background: rgba(14,143,118,.16); color: var(--accent); }
.stack-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 4px; }
.stack-col h3 { font-family: var(--font-head); font-size: 13px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.stack-col .stack-note { color: var(--muted); font-size: 11.5px; margin-bottom: 10px; }
.stack-col ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.stack-col ul li { margin-bottom: 6px; }
.stack-col ul li .live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--good); margin-right:6px; }
.stack-col ul li .design-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--muted); margin-right:6px; }

.filter-row { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.filter-row button {
  all: unset; cursor: pointer; font-size: 12px; font-family: var(--font-mono);
  padding: 5px 10px; border-radius: 5px; color: var(--muted); border: 1px solid var(--line);
}
.filter-row button.active { color: var(--text); border-color: var(--accent); background: var(--accent-dim); }

.simulated-note {
  font-size: 12px; color: var(--muted); background: var(--panel-2);
  border: 1px dashed var(--line); border-radius: 6px; padding: 9px 12px; margin-bottom: 18px;
}
.icp-note {
  font-size: 12.5px; color: var(--warn); background: rgba(180,83,9,.08);
  border: 1px dashed rgba(180,83,9,.4); border-radius: 6px; padding: 10px 12px; margin-bottom: 18px;
}

/* --- MCP tool cards --- */
.mcp-tool { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
.mcp-tool:last-child { margin-bottom: 0; }
.mcp-tool-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--panel-2); flex-wrap: wrap; }
.mcp-tool-head .tname { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
.perm-pill { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: .02em; }
.perm-pill.READ { background: rgba(14,143,118,.16); color: var(--accent); }
.perm-pill.WRITE { background: rgba(220,38,38,.16); color: var(--bad); }
.approval-pill { font-family: var(--font-mono); font-size: 10.5px; padding: 2px 8px; border-radius: 4px; background: rgba(180,83,9,.16); color: var(--warn); }
.mcp-tool-body { padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; font-size: 12.5px; }
.mcp-tool-body .k { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
.mcp-tool-body .v { font-family: var(--font-mono); font-size: 12px; }
.mcp-tool-body .full { grid-column: 1 / -1; }

/* --- ICP config --- */
.cfg-row { display: grid; grid-template-columns: 1fr 120px; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.cfg-row:last-child { border-bottom: none; }
.cfg-row input[type="number"], .cfg-row input[type="text"] {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  border-radius: 5px; padding: 6px 8px; font-family: var(--font-mono); font-size: 12.5px; width: 100%;
}
.cfg-checks { display: flex; flex-wrap: wrap; gap: 8px; }
.cfg-chip { font-family: var(--font-mono); font-size: 11.5px; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; user-select: none; }
.cfg-chip.on { color: var(--text); border-color: var(--accent); background: var(--accent-dim); }
.cfg-actions { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); }
.btn { all: unset; cursor: pointer; font-family: var(--font-mono); font-size: 12.5px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); color: var(--text); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
.btn.primary:hover { background: #0B7862; }
.btn.small { padding: 5px 10px; font-size: 11.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* --- Sequence --- */
.seq-step { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.seq-step:last-child { border-bottom: none; }
.seq-day { font-family: var(--font-mono); font-size: 12px; color: var(--accent); width: 64px; flex-shrink: 0; padding-top: 2px; }
.seq-body .chan { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
.seq-body .desc { color: var(--muted); font-size: 12.5px; }
.feedback-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.feedback-item { border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; font-size: 12.5px; }
.feedback-item .trig { font-family: var(--font-mono); color: var(--warn); font-size: 11px; margin-bottom: 3px; }

/* --- Agent run trace --- */
.run-step { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.run-step:last-child { border-bottom: none; }
.run-step .badge { flex-shrink: 0; width: 60px; text-align: center; font-family: var(--font-mono); font-size: 10px; font-weight: 700; padding: 3px 0; border-radius: 4px; letter-spacing: .02em; height: fit-content; }
.run-step .badge.engine { background: rgba(100,116,139,.2); color: var(--muted); }
.run-step .badge.agent { background: rgba(180,83,9,.18); color: var(--warn); }
.run-step .badge.gate { background: rgba(14,143,118,.16); color: var(--accent); }
.run-step .name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
.run-step .detail { color: var(--muted); font-size: 12.5px; }
.run-step .detail.fail { color: var(--bad); }
.run-step .conf { font-family: var(--font-mono); font-size: 10.5px; color: var(--warn); margin-left: 6px; }
.decision-trace-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.ops-criteria-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* --- System at a glance --- */
.glance-row { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; padding: 4px 4px 6px; }
.glance-card { flex: 1 1 160px; min-width: 160px; border-radius: 10px; padding: 16px 14px; border: 1px solid var(--line); }
.glance-card .emoji { font-size: 22px; margin-bottom: 8px; display: block; }
.glance-card h4 { margin: 0 0 6px; font-family: var(--font-head); font-size: 14px; font-weight: 700; }
.glance-card p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.glance-card.data { background: #F1F3F5; border-color: var(--line); }
.glance-card.engine { background: #F1F3F5; border-color: var(--line); }
.glance-card.agent { background: #FFF8F0; border-color: rgba(180,83,9,.25); }
.glance-card.human { background: var(--accent-dim); border-color: rgba(14,143,118,.3); }
.glance-card.out { background: #F1F3F5; border-color: var(--line); }
.glance-arrow { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; flex: 0 0 auto; padding: 0 2px; }
@media (max-width: 900px) { .glance-arrow { transform: rotate(90deg); } }

.mini-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 14px 4px; }
.mini-flow .mf-node { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; }
.mini-flow .mf-arrow { color: var(--muted); font-size: 14px; }
.tech-ref { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 12px; color: var(--muted); line-height: 1.9; }
.tech-ref .k { color: var(--accent); font-weight: 600; }
.compare-table td, .compare-table th { vertical-align: top; }
.compare-table td:first-child { font-weight: 700; white-space: nowrap; }
.compare-table td:not(:first-child) { color: var(--muted); line-height: 1.5; }
.compare-table .live-dot, .compare-table .design-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
.compare-table .live-dot { background: var(--good); }
.compare-table .design-dot { background: var(--line); border: 1px solid var(--muted); }
.decision-trace-grid .dt-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.decision-trace-grid .dt-card .k { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 5px; }
.decision-trace-grid .dt-card .v { font-size: 13px; line-height: 1.45; }
.autonomy-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.autonomy-row:last-child { border-bottom: none; }
.autonomy-row .dot { font-size: 16px; line-height: 1.3; }
.autonomy-row .label { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.autonomy-row .items { color: var(--muted); font-size: 12.5px; }

/* --- Ask the agent --- */
.ask-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.ask-chip { all: unset; cursor: pointer; font-size: 11.5px; font-family: var(--font-body); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); }
.ask-chip:hover { color: var(--text); border-color: var(--accent); }
.ask-row { display: flex; gap: 8px; }
.ask-row input { flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 8px 10px; font-family: var(--font-body); font-size: 13px; }
.ask-feed { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.ask-turn .q { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
.ask-turn .a { color: var(--muted); font-size: 13px; line-height: 1.55; background: var(--panel-2); border-radius: 6px; padding: 9px 11px; }

.jc-box { border: 1px solid rgba(14,143,118,.35); background: rgba(14,143,118,.06); border-radius: 8px; padding: 14px; }
.jc-box h3 { margin: 0 0 8px; font-family: var(--font-head); font-size: 13px; }
.jc-box ul { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text); }
.jc-box ul li { margin-bottom: 6px; }
.jc-box ul li b { color: var(--accent); }

.claude-live-box { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; margin-top: 10px; }
.claude-live-box textarea, .claude-live-box input[type="password"] {
  width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  border-radius: 6px; padding: 8px; font-family: var(--font-mono); font-size: 12px;
}
.claude-status { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.claude-status.err { color: var(--bad); }
.claude-status.ok { color: var(--good); }

/* --- Claude Agent chat bubbles --- */
.chat-thread { display: flex; flex-direction: column; gap: 10px; }
.chat-row { display: flex; }
.chat-row.user { justify-content: flex-end; }
.chat-row.agent { justify-content: flex-start; }
.chat-bubble { max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; white-space: pre-wrap; }
.chat-bubble.user { background: var(--accent); color: #FFFFFF; border-bottom-right-radius: 3px; }
.chat-bubble.agent { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
.chat-tool-chip { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 2px 9px; display: inline-block; align-self: flex-start; }
.chat-typing { font-size: 12.5px; color: var(--muted); font-style: italic; align-self: flex-start; }
.chat-approval-card { align-self: flex-start; max-width: 78%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; }

/* --- Model evaluation (human review of AI output / routing) --- */
.eval-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.eval-row .eval-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
.eval-row button.eval-btn.active[data-judgment="approved"], .eval-row button.eval-btn.active[data-agree="yes"] { background: var(--good); border-color: var(--good); color: #fff; }
.eval-row button.eval-btn.active[data-judgment="edited"] { background: var(--warn); border-color: var(--warn); color: #fff; }
.eval-row button.eval-btn.active[data-judgment="rejected"], .eval-row button.eval-btn.active[data-agree="no"] { background: var(--bad); border-color: var(--bad); color: #fff; }

@media (max-width: 900px) {
  .app { flex-direction: column; }
  .rail { position: static; width: 100%; height: auto; }
  .main { padding: 20px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .detail-grid { grid-template-columns: 1fr; }
  .mcp-tool-body { grid-template-columns: 1fr; }
  .feedback-grid { grid-template-columns: 1fr; }
}

function daysSince(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  return Math.round((TODAY - d) / 86400000);
}

  const push = (name, detected, evidence, confidence, source) =>

      signal_name: name, detected, evidence, confidence, source,
      observed_date: c.last_enriched, freshness_days: daysSince(c.last_enriched)

  // from the previous vertical, but here it flags a confirmed AI/automation

    capexDetected ? `Capex/new-plant signal on file: ${c.company_description}` : "No new plant or expansion capex announcement found",
    capexDetected ? "high" : "n/a", "research.company_description");

  const layoffsDetected = LAYOFF_PATTERN.test(c.company_description) || LAYOFF_PATTERN.test(c.estimated_growth || "");
  push("Layoffs or restructuring", layoffsDetected,
    layoffsDetected ? `Layoffs/restructuring referenced: ${c.company_description}` : "No layoffs or restructuring found",
    layoffsDetected ? "high" : "n/a", "research.company_description");

  const growthPct = parseGrowth(c.estimated_growth);
  push("Headcount growth trend confirmed", growthPct !== null,
    growthPct !== null ? `Estimated growth/trend: ${c.estimated_growth}` : "Growth/headcount trend not confirmed for this pass",
    growthPct !== null ? "medium" : "n/a", "research.estimated_growth");

  push("Multi-country operations", c.countries_of_operation.length > 1,
    `${c.countries_of_operation.length} countries of operation on file: ${c.countries_of_operation.join(", ")}`,
    c.countries_of_operation.length > 1 ? "high" : "n/a", "research.countries_of_operation");

  return signals;
}

// Real dataset doesn't carry a parseable YoY headcount % for any of the 15
// accounts this pass (unlike the previous vertical's Clay-sourced growth
// figures) — this only returns non-null for a future account where one is
// confirmed, e.g. "+8% headcount YoY"; a qualitative "declining"/"growing"
// note in estimated_growth is surfaced as its own signal text instead, not
// forced through this parser.
function parseGrowth(str) {
  const m = /(-)?\+?(\d+)%/.exec(str || "");
  if (!m) return null;
  const n = parseInt(m[2], 10);
  return m[1] ? -n : n;
}

// ---------------------------------------------------------------------------
// PHASE 4 — ICP SCORING (deterministic — the LLM never sets this)
// ---------------------------------------------------------------------------
function scoreAccount(c, signals) {
  const w = ICP_CONFIG.weights;
  const notes = [];
  let fit = 0;

  if (c.employee_count >= ICP_CONFIG.headcount_min && c.employee_count <= ICP_CONFIG.headcount_max) { fit += w.company_fit.headcount_band; notes.push(`+${w.company_fit.headcount_band} headcount in ${ICP_CONFIG.headcount_min}–${ICP_CONFIG.headcount_max} band (${c.employee_count})`); }
  else notes.push(`+0 headcount outside ${ICP_CONFIG.headcount_min}–${ICP_CONFIG.headcount_max} band (${c.employee_count})`);

  if (ICP_CONFIG.target_industries.includes(c.industry)) { fit += w.company_fit.relevant_profile; notes.push(`+${w.company_fit.relevant_profile} brewing/food & bev/CPG manufacturing profile (${c.industry})`); }
  else notes.push(`+0 industry profile not a strong match (${c.industry})`);

  if (c.countries_of_operation.length > 1) { fit += w.company_fit.multi_location; notes.push(`+${w.company_fit.multi_location} multi-location (${c.countries_of_operation.length} countries)`); }
  else notes.push(`+0 single location`);

  const relevantGeo = c.countries_of_operation.some(g => ICP_CONFIG.target_geos.includes(g));
  if (relevantGeo) { fit += w.company_fit.relevant_geo; notes.push(`+${w.company_fit.relevant_geo} relevant geography (US/Mexico/LATAM)`); }
  else notes.push(`+0 geography not in target list`);

  let sig = 0;
  const has = n => signals.find(s => s.signal_name === n)?.detected;
  if (has("AI / automation initiative underway")) { sig += w.signals.automation_ai; notes.push(`+${w.signals.automation_ai} confirmed AI/automation initiative`); }
  else notes.push(`+0 no confirmed AI/automation initiative`);

  if (has("New plant or expansion capex committed")) { sig += w.signals.capex_new_plant; notes.push(`+${w.signals.capex_new_plant} new plant or expansion capex committed`); }
  else notes.push(`+0 no new plant/capex signal`);

  if (has("Layoffs or restructuring")) { sig += w.signals.layoffs_restructuring; notes.push(`+${w.signals.layoffs_restructuring} layoffs/restructuring detected (cost pressure → efficiency mandate)`); }
  else notes.push(`+0 no layoffs/restructuring detected`);

  if (has("Headcount growth trend confirmed")) { sig += w.signals.headcount_growth; notes.push(`+${w.signals.headcount_growth} headcount/growth trend confirmed`); }
  else notes.push(`+0 no confirmed headcount/growth trend`);

  let contact = 0;
  // No contact-enrichment tool (Clay/ZoomInfo/Sales Navigator) was available
  // for this pass, so every account's contact is honestly "unknown" (see the
  // COMPANIES comment above) — but the likely buyer persona (Plant Director
  // / VP of Operations / CTO) is still inferable from signals alone for a
  // curated Tier-1 manufacturer, which is what this point actually credits.
  const personaMapped = identifyPersona(c, signals).persona !== "unknown";
  if (personaMapped) { contact += w.contact.persona_mapped; notes.push(`+${w.contact.persona_mapped} buyer persona mapped from signals (no named contact on file — see README)`); }
  else notes.push(`+0 could not map a buyer persona`);

  const total = fit + sig + contact;
  const tier = total >= ICP_CONFIG.tierA_threshold ? "A" : total >= ICP_CONFIG.tierB_threshold ? "B" : "C";

  return { total_score: total, company_fit_score: fit, signal_score: sig, contact_score: contact, tier, score_explanation: notes };
}

// ---------------------------------------------------------------------------
// PHASE 6 — PERSONA IDENTIFICATION
// Maps to the buyer personas the job posting names explicitly: plant
// directors, VPs of Operations, and CTOs at global brewers/food/CPG groups.
// ---------------------------------------------------------------------------
function identifyPersona(c, signals) {
  let persona = "VP of Operations";
  let reason = "Default operational buyer persona for a manufacturer this size — capex and plant-level decisions typically route through Operations.";
  if (signals.find(s => s.signal_name === "AI / automation initiative underway")?.detected) {
    persona = "CTO / VP of Digital Manufacturing";
    reason = "An active AI/automation initiative signals a technical buyer with budget and mandate already exists for exactly this category.";
  } else if (signals.find(s => s.signal_name === "New plant or expansion capex committed")?.detected) {
    persona = "VP of Operations";
    reason = "A new plant or expansion capex commitment puts ownership of ramping that facility to target availability/quality/throughput with a VP of Operations.";
  } else if (signals.find(s => s.signal_name === "Layoffs or restructuring")?.detected) {
    persona = "Plant Director";
    reason = "Cost pressure and restructuring put efficiency ownership with plant-level leadership, not corporate strategy.";
  }
  return {
    persona,
    reason_persona_is_relevant: reason,
    contact_name: c.contact.name,
    contact_title: c.contact.title,
    contact_email: c.contact.email,
    contact_confidence: c.contact.confidence
  };
}

// ---------------------------------------------------------------------------
// PHASE 5 — AI REASONING (structured JSON)
// DEMO NOTE: this function is a deterministic stand-in that returns the exact
// schema an OpenAI API call would return. It never sets icp_score or tier —
// those are passed in from the deterministic scorer. From an account's
// detail page, a viewer can optionally replace this output for one account
// with a real call to the OpenAI API (see callOpenAILive below); the JSON
// shape is identical either way, so nothing downstream needs to change.
// ---------------------------------------------------------------------------
function generateAIReasoning(c, signals, score) {
  const detected = signals.filter(s => s.detected);
  const primary = detected.sort((a, b) => (b.confidence === "high") - (a.confidence === "high"))[0];
  const secondary = detected.filter(s => s !== primary).map(s => s.signal_name);
  const missing = [];
  if (c.contact.name === "unknown") missing.push("confirmed plant-level decision-maker contact (no contact-enrichment tool used this pass)");
  if (c.estimated_growth === "unknown" || /unknown/i.test(c.estimated_growth)) missing.push("confirmed headcount/growth trend");
  if (c.technology_context === "unknown" || /unknown/i.test(c.technology_context)) missing.push("current automation/digital-manufacturing maturity");

  let painHypothesis, reasonNow;
  if (primary?.signal_name.includes("automation")) {
    painHypothesis = `INFERENCE: an account already investing in AI/automation for one line or plant (${c.technology_context}) is plausibly looking to standardize that pattern across more sites rather than re-build it bespoke each time — this is a plausible read of a live initiative, not a confirmed roadmap statement from ${c.company_name}.`;
    reasonNow = "An active automation/AI initiative means budget and technical mandate already exist — outreach timed to a live initiative reaches someone actively evaluating this category, not someone who needs to be sold on the category itself.";
  } else if (primary?.signal_name.includes("plant") || primary?.signal_name.includes("capex")) {
    painHypothesis = `INFERENCE: ramping a new plant or expansion to target availability/quality/throughput on the original timeline is a known failure point without real-time visibility across PLC/MES/ERP from day one — inferred from the scale of the announced investment, not a confirmed statement from ${c.company_name}.`;
    reasonNow = "New-plant and expansion-capex windows are when the operating model for a site gets set — reaching the VP of Operations before that model hardens has a materially better chance of a real evaluation.";
  } else if (primary?.signal_name.includes("Layoffs") || primary?.signal_name.includes("restructuring")) {
    painHypothesis = `INFERENCE: leaner plant teams after layoffs/restructuring at ${c.company_name} typically need automated detection and coordination to hold the same availability/quality/throughput with fewer people watching dashboards — this is a category-level pattern following cost pressure, not a confirmed internal priority.`;
    reasonNow = "Restructuring windows create real urgency to do more with less on the plant floor — that budget conversation is happening now, not in a future planning cycle.";
  } else if (primary?.signal_name.includes("Multi-country")) {
    painHypothesis = `INFERENCE: coordinating operations across ${c.countries_of_operation.length} countries typically forces a re-evaluation of whether each plant runs its own bespoke tooling or one standardized layer — a category-level pattern, not a confirmed statement from ${c.company_name}.`;
    reasonNow = "Multi-country manufacturing groups are a known trigger point for standardizing on one platform before scale makes a per-site approach unmanageable.";
  } else {
    painHypothesis = `FACT: no strong buying signal was detected for ${c.company_name} in this dataset; any pain hypothesis here would be speculative.`;
    reasonNow = "Insufficient signal strength to justify a timing-based outreach angle right now.";
  }

  return {
    icp_score: score.total_score,
    tier: score.tier,
    primary_signal: primary ? primary.signal_name : "none detected",
    secondary_signals: secondary,
    pain_hypothesis: painHypothesis,
    recommended_persona: identifyPersona(c, signals).persona,
    reason_to_contact_now: reasonNow,
    outreach_angle: primary ? `Lead with the ${primary.signal_name.toLowerCase()} signal, tie it to availability/quality/throughput risk on the floor, offer a scoped conversation — not a demo pitch.` : "Insufficient signal to justify outreach; hold for nurture.",
    confidence: detected.length >= 3 ? "high" : detected.length >= 1 ? "medium" : "low",
    missing_information: missing,
    source: "simulated"
  };
}

// ---------------------------------------------------------------------------
// PHASE 7 — PERSONALIZED OUTREACH (<= ~80 words)
// ---------------------------------------------------------------------------
// Evidence strings from detectSignals() are pre-labeled, e.g.
// `Capex/new-plant signal on file: Brewer of ... Building a $760M ...`.
// Quoting the whole thing again in outreach copy nests the label inside a
// second label ("saw this: Capex/new-plant signal on file: ..."). This
// strips one leading "Label:" prefix so the message quotes the underlying
// fact instead of the internal citation label.
function stripEvidenceLabel(evidenceText) {
  const m = /^[^:—]{0,60}[:—]\s*(.*)$/s.exec(evidenceText || "");
  let fact = (m ? m[1] : evidenceText || "").trim();
  // Parentheticals in this data are sourcing metadata ("(Food Dive, 2026)",
  // "(quoted from ...)") — useful for an internal QA trail, never something
  // you'd say to the actual prospect.
  fact = fact.replace(/\([^)]*\)/g, " ").replace(/\s{2,}/g, " ").trim();
  // Some evidence strings bundle several clauses with "; " — internal
  // research-process metadata alongside the actual fact. Keep only the
  // first clause that isn't research-process narrative, since that's
  // reliably the actual signal itself.
  const clauses = fact.split(/;\s*/).map(s => s.trim()).filter(Boolean)
    .filter(clause => !/no contact-enrichment tool|this pass|this demo/i.test(clause));
  fact = clauses[0] || "";
  return fact.replace(/\.+\s*$/, "").trim(); // caller adds its own trailing period
}

// Pulls a short quoted dollar figure or plant/city name out of an evidence
// string when one is present (e.g. "$760M brewing and bottling complex in
// Apan, Hidalgo") — used to ground an outreach hook in the literal cited
// fact instead of a paraphrase of the signal category.
function extractQuotedRole(evidenceText) {
  const m = /(\$[\d.,]+\s?(?:M|B|million|billion))/i.exec(evidenceText || "");
  return m ? m[1] : null;
}

// Turns one buildWhyAllie() reason (written for the account-detail page,
// e.g. "Standardizing on one AI-agent layer beats bespoke PLC/MES/ERP
// integration per plant.") into a first-person sentence naming Allie, so the
// outreach message actually answers the question a prospect always has: why
// THIS vendor, not just "why now". Falls back to a generic mention if no
// reason cleared (score too weak to draw a credible connection).
function alliePitchLine(whyAllie) {
  const top = whyAllie && whyAllie[0];
  if (!top || /no strong fit signal/i.test(top.attr)) {
    return "Allie integrates intelligence into factory operations — connecting to PLCs, MES and ERPs through secure edge gateways to detect problems, recommend actions and coordinate responses in real time.";
  }
  const reason = top.link.replace(/\.+\s*$/, "");
  return `That's exactly what Allie is built for: ${reason.charAt(0).toLowerCase() + reason.slice(1)}.`;
}

function generateOutreach(c, signals, reasoning, persona, whyAllie) {
  const primary = reasoning.primary_signal;
  const evidence = signals.find(s => s.signal_name === primary)?.evidence || "";
  if (reasoning.confidence === "low") {
    return { subject_line: "(hold, insufficient signal)", opening_line: "(none)", message: "Not enough evidence to justify a personalized outreach angle for this account yet. Recommend nurture over outbound.", call_to_action: "(none)", evidence_used: "none" };
  }
  const p = primary.toLowerCase();
  const firstName = c.contact.name !== "unknown" ? c.contact.name.split(" ")[0] : null;
  const greeting = firstName ? `Hi ${firstName},` : "Hi,";
  const fact = stripEvidenceLabel(evidence);
  const dollarFigure = extractQuotedRole(evidence);

  // Ground the opener in the literal cited fact where there is one — "saw
  // the actual figure/plant" reads as researched; a paraphrase of the signal
  // category reads as a mail-merge. Phrasing avoids two things that read as
  // robotic in a first-touch message: naming HOW the fact was found ("saw
  // this at X:", a colon before a quote), and burying the ask three
  // sentences deep.
  let hook;
  if (p.includes("automation")) {
    hook = fact ? `saw the automation/AI work already underway at ${c.company_name}: ${fact}` : `saw ${c.company_name} is already investing in plant automation`;
  } else if (p.includes("plant") || p.includes("capex")) {
    hook = dollarFigure ? `saw the ${dollarFigure} investment ${c.company_name} just committed to a new plant/expansion` : (fact ? `saw ${c.company_name}'s new plant/expansion: ${fact}` : `saw ${c.company_name}'s recent expansion capex`);
  } else if (p.includes("layoffs") || p.includes("restructuring")) {
    hook = fact ? `saw the restructuring at ${c.company_name}: ${fact}` : `saw ${c.company_name}'s recent restructuring`;
  } else if (p.includes("multi-country")) {
    hook = `noticed ${c.company_name} now runs plants across ${c.countries_of_operation.length} countries (${c.countries_of_operation.join(", ")})`;
  } else {
    hook = `came across ${c.company_name}`;
  }

  // A VP of Operations or Plant Director doesn't move on "curious how you're
  // handling this" — they move on a specific business reason wired to their
  // actual scope (unplanned downtime, quality deviations, changeover time,
  // headcount they're accountable for), stated plainly, with a low-friction
  // next step that doesn't presume the sale. Length is deliberate: a
  // one-liner reads as spray-and-pray; this reads as someone who looked at
  // the account and thought about their role specifically.
  const pitch = alliePitchLine(whyAllie);
  const titleLower = (persona.persona || "your team").toLowerCase();
  const message = `${greeting} ${hook.charAt(0).toUpperCase() + hook.slice(1)}.

I'm reaching out from Allie. We build AI agents for manufacturing — connecting to PLCs, MES and ERPs through secure edge gateways to turn raw floor data into operational decisions in real time, which looks like exactly the kind of investment ${c.company_name} is already moving toward.

${pitch}

For someone in your seat, that usually shows up as three concrete things: fewer unplanned-downtime surprises because the system flags a developing problem before it stops the line, faster root-cause on quality deviations instead of a shift-end postmortem, and agents that coordinate the response instead of one more dashboard for your team to babysit.

This isn't a decision to make from an email thread. If there's a real fit, a 20-minute call with one of our solutions engineers would show concretely where Allie would plug into how ${titleLower} runs the floor at ${c.company_name} today.`;
  const subject = `${c.company_name} + Allie: catching downtime before it stops the line`;
  const cta = "Do you have 20 minutes in the next two weeks?";
  return { subject_line: subject, opening_line: `${greeting} ${hook}.`, message, call_to_action: cta, evidence_used: evidence };
}

// ---------------------------------------------------------------------------
// PHASE 7b — SEQUENCE (Tier A only) + FEEDBACK LOOP RULES
// Mirrors the "sourcing → contact → research → priority → personalization →
// sequencing → engagement orchestration" flow the role description asks for
// (SYS03, outbound engine — email + LinkedIn shown here; the parallel
// cold-calling engine is design-only, see README).
// ---------------------------------------------------------------------------
function buildSequence(c, signals, reasoning, persona) {
  const primary = reasoning.primary_signal;
  const leadAngle = (primary.toLowerCase().includes("automation") || primary.toLowerCase().includes("plant") || primary.toLowerCase().includes("capex"))
    ? `Growth/investment signal: ${primary.toLowerCase()}` : `Primary signal: ${primary.toLowerCase()}`;
  return {
    steps: [
      { day: 1, channel: "Email", description: `${leadAngle} — opening email personalized from ${persona.persona}'s likely priority.` },
      { day: 3, channel: "LinkedIn", description: "Short connection note referencing the same signal, no pitch." },
      { day: 6, channel: "Email", description: "Second email, different angle — downtime/quality/throughput risk framed around the new plant, capex or restructuring." },
      { day: 10, channel: "Final touch", description: "Operational-risk insight (unplanned downtime cost, changeover time, or safety angle) as a break-up-style final message." }
    ],
    feedback_rules: [
      { trigger: "Positive reply", action: "Stop all automation immediately — technical sales takes the conversation." },
      { trigger: "Meeting booked", action: "Suppress all remaining automated outreach for this account." },
      { trigger: "No response after full sequence", action: "Pause outreach until a new signal is detected." },
      { trigger: "Not interested", action: "Suppress account / move to long-cycle nurture." }
    ]
  };
}

// ---------------------------------------------------------------------------
// PHASE 8 — ROUTING ENGINE (deterministic, logged)
// Routing depends on score AND evidence sufficiency AND a mapped buyer
// persona. Unlike a pass with real contact enrichment, this dataset has no
// named contact for any account (see COMPANIES comment) — a BDR/technical-
// sales handoff here means "signal-armed and persona-mapped, contact
// discovery still to do," which is what "Route to BDR" means throughout
// this demo's copy.
// ---------------------------------------------------------------------------
function routeAccount(c, signals, score) {
  const detectedCount = signals.filter(s => s.detected).length;
  const hasSufficientEvidence = detectedCount >= ICP_CONFIG.min_signals_for_evidence;
  const personaMapped = identifyPersona(c, signals).persona !== "unknown";

  if (score.tier === "A") {
    if (hasSufficientEvidence && personaMapped) {
      return { action: "Route to BDR", crm_status: "Synced to CRM · HIGH PRIORITY", queue: "BDR — immediate", reason: `Score ${score.total_score} ≥ ${ICP_CONFIG.tierA_threshold}, ${detectedCount} signals detected, buyer persona mapped (no named contact — see README on contact enrichment).` };
    }
    if (!personaMapped) {
      return { action: "Contact enrichment", crm_status: "Synced to CRM · needs contact", queue: "Enrichment queue", reason: `Score ${score.total_score} ≥ ${ICP_CONFIG.tierA_threshold} but no buyer persona could be mapped — route to enrichment before BDR.` };
    }
    return { action: "Nurture / research", crm_status: "Synced to CRM · nurture", queue: "Marketing nurture", reason: `Score ${score.total_score} ≥ ${ICP_CONFIG.tierA_threshold} but only ${detectedCount} signal(s) detected — below the ${ICP_CONFIG.min_signals_for_evidence}-signal evidence bar for a BDR handoff.` };
  }
  if (score.tier === "B") {
    return { action: "Nurture / research", crm_status: "Synced to CRM · nurture", queue: "Marketing nurture", reason: `Score ${score.total_score} in the ${ICP_CONFIG.tierB_threshold}–${ICP_CONFIG.tierA_threshold - 1} band.` };
  }
  return { action: "Suppress", crm_status: "Not synced", queue: "None", reason: `Score ${score.total_score} below ${ICP_CONFIG.tierB_threshold}.` };
}

function routeTagClass(action) {
  if (action === "Route to BDR") return "route-bdr";
  if (action === "Contact enrichment") return "route-enrich";
  if (action === "Nurture / research") return "route-nurture";
  return "route-suppress";
}

// ---------------------------------------------------------------------------
// "Why Allie?" — connects researched signals to the actual product (edge
// gateways into PLC/MES/ERP, real-time monitoring → autonomous control,
// availability/quality/throughput), not a generic value prop.
// ---------------------------------------------------------------------------
function buildWhyAllie(c, signals) {
  const reasons = [];
  if (signals.find(s => s.signal_name === "AI / automation initiative underway")?.detected) {
    reasons.push({ attr: "Already investing in plant AI/automation", link: "Sitting on top of the sensor/PLC data an existing automation initiative already produces, coordinating the response instead of adding another isolated dashboard." });
  }
  if (signals.find(s => s.signal_name === "New plant or expansion capex committed")?.detected) {
    reasons.push({ attr: "New plant or expansion capex committed", link: "Standing up one AI-agent layer across PLC/MES/ERP at a new or expanding site beats re-building bespoke integration and tribal-knowledge alarms at every plant." });
  }
  if (c.countries_of_operation.length > 1) {
    reasons.push({ attr: `Operates plants across ${c.countries_of_operation.length} countries`, link: "One platform that connects to PLCs/MES/ERPs via edge gateways scales the same agents across sites instead of a bespoke build per country." });
  }
  if (signals.find(s => s.signal_name === "Layoffs or restructuring")?.detected) {
    reasons.push({ attr: "Recent layoffs/restructuring", link: "Leaner plant teams need agents that detect problems and coordinate the response automatically, not more headcount watching dashboards." });
  }
  if (reasons.length === 0) {
    reasons.push({ attr: "No strong fit signal detected", link: "Not enough evidence yet to draw a credible connection to Allie's product — hold for more research rather than force an angle." });
  }
  return reasons;
}

// ---------------------------------------------------------------------------
// PHASE 13 — QA CHECK (deterministic claim verification)
// Verifies the generated outreach doesn't say anything the evidence engine
// didn't actually detect. This is the "QA Agent" step from a governance
// standpoint, but it's implemented here as a plain deterministic check —
// not a model call — because verifying "does this claim trace to a citation"
// is exactly the kind of thing that should be reproducible, not sampled.
// ---------------------------------------------------------------------------
function qaCheckOutreach(signals, outreach, reasoning) {
  if (reasoning.confidence === "low") {
    return { passed: true, note: "Outreach correctly held back — insufficient signal to justify a claim either way." };
  }
  const citedEvidence = signals.find(s => s.detected && s.evidence === outreach.evidence_used);
  if (!citedEvidence) {
    return { passed: false, note: "Outreach evidence_used does not match any detected signal's citation — would have blocked send." };
  }
  return { passed: true, note: `Every claim in the outreach traces to a detected signal ("${citedEvidence.signal_name}", source: ${citedEvidence.source}).` };
}

// ---------------------------------------------------------------------------
// PHASE 14 — AGENT RUN TRACE
// A step-by-step execution trace for the account detail page's "Agent Run"
// panel. Each step is labeled ENGINE (deterministic code), AGENT (the one
// place a model's output can flow through), or GATE (a branch point) — never
// blurred together, so the trace itself demonstrates the same principle the
// rest of this demo argues for: AI where reasoning helps, deterministic
// logic where consistency matters. Step order mirrors buildAccountRecord()
// exactly; there's no separate simulation of the pipeline. The step list
// runs in a fixed sequence in the browser (not over real network time), so
// this trace shows order and outcome, not real per-step latency.
// ---------------------------------------------------------------------------
const LIVE_REASONING_OVERRIDES = {}; // accountId -> reasoning object from OpenAI
const LIVE_REASONING_META = {}; // accountId -> { model, tokens, latency_ms, estimated_cost_usd }
// The live OpenAI call only ever returns the reasoning JSON (see
// netlify/functions/ai-reasoning.mjs) — it never drafts outreach copy
// itself. To keep the "Generated outreach" panel honest once a viewer
// triggers live reasoning, the SAME deterministic outreach/QA engine used
// everywhere else in this app is re-run locally against the live reasoning
// output, so the personalization on screen actually reflects what GPT said
// instead of silently staying frozen on the original simulated draft.
const LIVE_OUTREACH_OVERRIDES = {}; // accountId -> outreach object, regenerated from live reasoning
const LIVE_QA_OVERRIDES = {}; // accountId -> qa object, regenerated from live reasoning
let LIVE_AI_SPEND_USD = 0;
let LIVE_AI_CALL_COUNT = 0;

// ---------------------------------------------------------------------------
// SYSTEM HEALTH LOG — every real network call this session makes (live AI
// reasoning, Zapier webhook, HubSpot writes, the site-backend route-to-BDR
// function) is logged here as it happens, success or failure. Nothing in
// this log is simulated or backfilled — it starts with one historical entry
// for the one-time web-research pass that seeded the dataset (see README),
// and stays empty of call activity until a viewer actually triggers one of
// the live integrations from an account detail page.
// ---------------------------------------------------------------------------
const SYSTEM_HEALTH_LOG = [
  { ts: new Date("2026-09-24T00:00:00Z").toISOString(), system: "Public signal research", account: "all 15 companies", status: "success", retry: false, detail: "One-time manual web-research pass that seeded this dataset (no Clay or other enrichment tool was available this pass — see README). Historical — not re-run live by this app, so no retry/latency data was captured for it." }
];
function logHealth(system, account, status, detail, latencyMs) {
  SYSTEM_HEALTH_LOG.unshift({ ts: new Date().toISOString(), system, account, status, retry: false, detail, latency_ms: latencyMs });
}

// ---------------------------------------------------------------------------
// MODEL EVALUATION — human review of AI output and routing, captured from
// each account's detail page (Approve/Edit/Reject on the AI reasoning and
// on the generated outreach; agree/disagree on the deterministic routing
// decision). This is the KPI surface for "does a human accept the model's
// output" and "does a human agree with what the system ranked highest" —
// real judgments made in this session, nothing pre-filled or simulated.
// Resets on reload, same as every other session-only log in this app.
// ---------------------------------------------------------------------------
const MODEL_EVAL = {}; // accountId -> { reasoning: "approved"|"edited"|"rejected"|null, outreach: same, routing_agree: true|false|null }
function getModelEval(id) { return MODEL_EVAL[id] || (MODEL_EVAL[id] = { reasoning: null, outreach: null, routing_agree: null }); }

function buildAgentRun(c, signals, score, reasoning, persona, outreach, qa, routing) {
  const detectedCount = signals.filter(s => s.detected).length;
  const steps = [
    { type: "engine", name: "Signal research", detail: `Loaded public-signal research for ${c.company_name} (compiled ${c.last_enriched}) — ${c.countries_of_operation.length} countries on file.` },
    { type: "engine", name: "Signal Detection", detail: `${detectedCount} of ${signals.length} candidate signals detected.` },
    { type: "engine", name: "ICP Scoring", detail: `Score ${score.total_score}/100 → Tier ${score.tier}.` },
    { type: "gate", name: "Qualification Gate", detail: score.tier === "C" ? "Score below the Tier B threshold — this account doesn't clear the bar to justify reasoning, persona work or outreach; the trace stops here." : "Score clears the gate — continuing to AI Reasoning." }
  ];
  if (score.tier !== "C") {
    steps.push({ type: "agent", name: "AI Reasoning", confidence: reasoning.confidence, detail: reasoning.source === "live_openai" ? `Live OpenAI API call (server-side key)${LIVE_REASONING_META[c.id] ? ` — ${LIVE_REASONING_META[c.id].total_tokens} tokens, ${LIVE_REASONING_META[c.id].latency_ms}ms, ~$${LIVE_REASONING_META[c.id].estimated_cost_usd.toFixed(6)}` : ""}.` : "Deterministic simulator — returns the exact JSON shape an OpenAI call would produce." });
    steps.push({ type: "engine", name: "Persona Selection", detail: `Selected: ${persona.persona}.` });
    steps.push({ type: "engine", name: "Outreach Templating", detail: reasoning.confidence === "low" ? "Held — insufficient signal to draft outreach." : "Generated from the primary cited signal." });
    steps.push({ type: "engine", name: "QA Check", detail: qa.note, failed: !qa.passed });
  }
  steps.push({ type: "engine", name: "Routing", detail: `${routing.action} — ${routing.reason}` });
  steps.push({ type: "gate", name: "Human Approval", detail: routing.action === "Route to BDR" ? "Required before any outreach send or CRM write — see Governance in Architecture." : "Not applicable — this account was not routed to BDR." });
  return steps;
}

// ---------------------------------------------------------------------------
// PHASE 12 — PIPELINE: build the full auditable record per account
// ---------------------------------------------------------------------------
function buildAccountRecord(c) {
  const signals = detectSignals(c);
  const score = scoreAccount(c, signals);
  const persona = identifyPersona(c, signals);
  const reasoning = generateAIReasoning(c, signals, score);
  const whyAllie = buildWhyAllie(c, signals);
  const outreach = generateOutreach(c, signals, reasoning, persona, whyAllie);
  const qa = qaCheckOutreach(signals, outreach, reasoning);
  const routing = routeAccount(c, signals, score);
  const sequence = buildSequence(c, signals, reasoning, persona);
  const agentRun = buildAgentRun(c, signals, score, reasoning, persona, outreach, qa, routing);
  return {
    raw_input: { company_name: c.company_name, website: c.website },
    enriched: c,
    signals,
    score,
    persona,
    ai_reasoning: reasoning,
    outreach,
    qa,
    routing,
    sequence,
    whyAllie,
    agentRun,
    timestamp: new Date().toISOString()
  };
}

let ACCOUNTS = COMPANIES.map(buildAccountRecord);
let ROUTING_LOG = buildRoutingLog();
function buildRoutingLog() {
  return ACCOUNTS.map(a => ({
    company_name: a.enriched.company_name,
    score: a.score.total_score,
    tier: a.score.tier,
    action: a.routing.action,
    reason: a.routing.reason,
    crm_status: a.routing.crm_status,
    timestamp: a.timestamp
  }));
}

function recomputePipeline() {
  ACCOUNTS = COMPANIES.map(buildAccountRecord);
  ROUTING_LOG = buildRoutingLog();
}

// ---------------------------------------------------------------------------
// OPTIONAL — live OpenAI call for AI Research & Reasoning on a single account.
// Runs server-side via a Netlify Function (netlify/functions/ai-reasoning.mjs)
// holding the site owner's OPENAI_API_KEY — no visitor credential needed.
// Scoring/routing are untouched — only ai_reasoning (and the outreach copy
// derived from it) is replaced. The function returns real token usage,
// latency and an estimated cost, tracked here for the Agent Run trace and
// the Outcomes page's running AI-spend total.
// ---------------------------------------------------------------------------
async function callOpenAILive(c, signals, score) {
  const res = await fetch("/.netlify/functions/ai-reasoning", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      company: { name: c.company_name, industry: c.industry, employee_count: c.employee_count,
        countries_of_operation: c.countries_of_operation, estimated_growth: c.estimated_growth,
        technology_context: c.technology_context },
      contact_first_name: c.contact.name !== "unknown" ? c.contact.name.split(" ")[0] : null,
      detected_signals: signals.filter(s => s.detected).map(s => ({ name: s.signal_name, evidence: s.evidence, confidence: s.confidence })),
      icp_score: score.total_score, tier: score.tier
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Backend error ${res.status}`);
  return data; // { reasoning, meta }
}

let ZAPIER_WEBHOOK_URL = "";
let HUBSPOT_TOKEN = "";
const LIVE_ORCHESTRATION_FIRED = {}; // accountId -> { zapier: bool, hubspot: bool }

async function fireZapierWebhook(c, a) {

async function createHubspotContactAndDeal(c, a) {
  const contactRes = await fetch("https://api.hubapi.com/crm/v3/objects/contacts", {
    method: "POST",
    headers: { "content-type": "application/json", "authorization": `Bearer ${HUBSPOT_TOKEN}` },
    body: JSON.stringify({
      properties: {
        firstname: a.persona.contact_name !== "unknown" ? a.persona.contact_name.split(" ")[0] : "Unknown",
        lastname: a.persona.contact_name !== "unknown" ? a.persona.contact_name.split(" ").slice(1).join(" ") || "Contact" : "Contact",
        jobtitle: a.persona.contact_title, company: c.company_name, website: c.website
      }
    })
  });
  if (!contactRes.ok) {
    const errText = await contactRes.text().catch(() => "");
    throw new Error(`HubSpot contact create failed (${contactRes.status}): ${errText.slice(0, 200)}`);
  }
  const contact = await contactRes.json();

  const dealRes = await fetch("https://api.hubapi.com/crm/v3/objects/deals", {
    method: "POST",
    headers: { "content-type": "application/json", "authorization": `Bearer ${HUBSPOT_TOKEN}` },
    body: JSON.stringify({
      properties: {
        dealname: `${c.company_name} — GTM AI Outbound Engine (score ${a.score.total_score}, tier ${a.score.tier})`,
        dealstage: "appointmentscheduled", pipeline: "default"
      },
      associations: [{ to: { id: contact.id }, types: [{ associationCategory: "HUBSPOT_DEFINED", associationTypeId: 3 }] }]
    })
  });
  if (!dealRes.ok) {
    const errText = await dealRes.text().catch(() => "");
    throw new Error(`HubSpot deal create failed (${dealRes.status}): ${errText.slice(0, 200)} (contact ${contact.id} was created)`);
  }
  return { contactId: contact.id };
}

// ---------------------------------------------------------------------------
// "Ask about this account" — a deterministic Q&A over data this pipeline
// already computed for the account. This is pattern-matching over already-
// real data, not a new model call — it never invents a fact that isn't
// already in the account record. If the viewer has activated live OpenAI
// reasoning for this account (see the panel below), answers about "why now"
// / "pain hypothesis" reflect that live output instead of the simulator,
// same as everywhere else in this page.
// ---------------------------------------------------------------------------
const SUGGESTED_QUESTIONS = [
  "Why is this account prioritized?",
  "Why now?",
  "What tools can the agent use here?",
  "What would move this to Tier A?",
  "What's the biggest risk of being wrong here?"
];

function nextTierHint(a) {
  if (a.score.tier === "A") return "Already Tier A — nothing further needed to clear the routing gate.";
  const gaps = a.score.score_explanation.filter(n => n.startsWith("+0"));
  if (gaps.length === 0) return "No scoring gaps left to close — the remaining points would come from a policy change (see ICP Config), not new evidence.";
  const nextTier = a.score.tier === "B" ? "A" : "B";
  const target = nextTier === "A" ? ICP_CONFIG.tierA_threshold : ICP_CONFIG.tierB_threshold;
  const pointsNeeded = target - a.score.total_score;
  const prefix = a.score.tier === "C" ? `This account isn't Tier A material yet — it would need to clear Tier B first. ` : "";
  return `${prefix}${pointsNeeded} more point${pointsNeeded === 1 ? "" : "s"} would reach Tier ${nextTier} (score ${a.score.total_score} → ${target}). Open gaps today: ${gaps.slice(0, 3).map(g => g.replace(/^\+0\s*/, "")).join("; ")}.`;
}

function answerAgentQuestion(c, a, q, reasoning) {
  const ql = q.toLowerCase();
  if (/why.*(priorit|account\??$)|priorit/.test(ql)) {
    return `Score ${a.score.total_score}/100 (Tier ${a.score.tier}) — deterministic, from company fit (${a.score.company_fit_score}/40) + buying signals (${a.score.signal_score}/40) + contact quality (${a.score.contact_score}/20). See Score breakdown for the full line-by-line math.`;
  }
  if (/why now|timing/.test(ql)) {
    return a.score.tier === "C" ? "No timing signal strong enough to act on yet — this account didn't clear the qualification gate, so no reasoning step ran on it." : reasoning.reason_to_contact_now;
  }
  if (/tool|access|permission|mcp/.test(ql)) {
    return `This account can only be touched through the documented MCP surface: search_account, get_account_score, qualify_account and list_high_priority_accounts are READ ONLY. The one write tool, route_account, requires human approval before it fires — it cannot set a routing action inconsistent with this account's actual score. Full contract is in Architecture → MCP tool surface.`;
  }
  if (/tier a|move.*tier|what would|improve|threshold/.test(ql)) {
    return nextTierHint(a);
  }
  if (/risk|wrong|fail|confidence/.test(ql)) {
    const staleSignal = a.signals.find(s => s.detected && s.freshness_days > 30);
    const base = `AI confidence on this account: ${reasoning.confidence}. `;
    return base + (staleSignal
      ? `Biggest concrete risk: the "${staleSignal.signal_name}" signal is ${staleSignal.freshness_days} days old — it could be stale by the time a seller acts on it. This demo re-enriches on a snapshot basis, not continuously.`
      : `Biggest general risk for this system: unsupported personalization — outreach claiming something the evidence doesn't support. That's exactly what the QA check below exists to catch before anything is shown.`);
  }
  if (/person|contact|who/.test(ql)) {
    return a.persona.contact_name !== "unknown"
      ? `${a.persona.contact_name}, ${a.persona.contact_title} — ${a.persona.reason_persona_is_relevant}`
      : `No confirmed contact yet. Recommended persona: ${a.persona.persona} — ${a.persona.reason_persona_is_relevant}`;
  }
  if (/route|bdr|crm|approv/.test(ql)) {
    return `${a.routing.action} — ${a.routing.reason} Any CRM write or outreach send from here still requires a human to click through the Live Orchestration panel; nothing fires automatically.`;
  }
  return `Not sure how to answer that one from this account's data. Try: ${SUGGESTED_QUESTIONS.filter(s => s.toLowerCase() !== ql).slice(0, 3).join(" / ")}`;
}

        backendStatus.className = "claude-status err";
      }
    });
  }

  const askFeed = wrap.querySelector("#ask-feed");
  const askInput = wrap.querySelector("#ask-input");
  function askQuestion(q) {
    if (!q.trim()) return;
    const turn = el(`<div class="ask-turn"><div class="q">${esc(q)}</div><div class="a">${esc(answerAgentQuestion(c, a, q, r))}</div></div>`);
    askFeed.appendChild(turn);
    askInput.value = "";
  }
  wrap.querySelector("#ask-btn").addEventListener("click", () => askQuestion(askInput.value));
  askInput.addEventListener("keydown", (e) => { if (e.key === "Enter") askQuestion(askInput.value); });
  wrap.querySelectorAll("#ask-chips .ask-chip").forEach(chip => chip.addEventListener("click", () => askQuestion(chip.dataset.q)));

  return wrap;
}
function renderInference(text) {
  const m = /^(FACT|INFERENCE):\s*(.*)$/s.exec(text);
  if (!m) return esc(text);
  return `<span class="inference-tag ${m[1]}">${m[1]}</span>${esc(m[2])}`;
}
function fieldRow(k, v) { return `<div class="field-row"><span class="k">${esc(k)}</span><span class="val">${esc(v)}</span></div>`; }
function scoreBar(label, val, max) {
  return `<div class="score-bar-row"><div class="lbl"><span>${esc(label)}</span><span class="n">${val}/${max}</span></div><div class="bar-track"><div class="bar-fill" style="width:${(val / max) * 100}%"></div></div></div>`;
}

/* ---------------------------------------------------------------- OUTCOMES */
// Real, computed-from-this-run numbers stop at "sequences launched" — no
// outreach in this demo has actually been sent to a real company. Everything
// past that point (replies, meetings, opportunities) is an ILLUSTRATIVE
// funnel built from fixed, disclosed assumption rates applied to the real
// sequence count, not measured campaign data. Labeled as such throughout,
// same rule as every other simulated number in this project.
const ILLUSTRATIVE_FUNNEL_ASSUMPTIONS = { reply_rate: 0.35, meeting_rate_of_replies: 0.55, opportunity_rate_of_meetings: 0.5 };

// ---------------------------------------------------------------------------
// CLOSED-LOOP LEARNING — outcomes suggest an ICP Config weight change; a
// human approves or dismisses it before anything is applied. The suggestion
// itself is computed from the (illustrative, since no real replies exist
// yet) reply-rate-by-signal table above: reward the weight of the
// highest-performing signal, trim the weight of the lowest-performing one.
// Nothing here writes to ICP_CONFIG until #closed-loop-approve is clicked —
// there is no code path that applies a suggestion automatically.
// ---------------------------------------------------------------------------
let CLOSED_LOOP_STATUS = "pending"; // pending | applied | dismissed
const CLOSED_LOOP_LOG = [];
function computeClosedLoopSuggestion() {
  const w = ICP_CONFIG.weights.signals;
  return {
    raises: [{ key: "it_security_hiring", label: "IT/security hiring", from: w.it_security_hiring, to: w.it_security_hiring + 5, reasonSignal: "Security hiring", reasonRate: "11%" }],
    cuts: [{ key: "remote_hybrid", label: "Remote/hybrid workforce", from: w.remote_hybrid, to: Math.max(0, w.remote_hybrid - 3), reasonSignal: "Remote workforce", reasonRate: "2%" }]
  };
}

function renderOutcomes() {
  const tierA = ACCOUNTS.filter(a => a.score.tier === "A");
  const tierB = ACCOUNTS.filter(a => a.score.tier === "B");
  const sequencesLaunched = tierA.length;
  const f = ILLUSTRATIVE_FUNNEL_ASSUMPTIONS;
  const replies = Math.round(sequencesLaunched * f.reply_rate);
  const meetings = Math.round(replies * f.meeting_rate_of_replies);
  const opportunities = Math.round(meetings * f.opportunity_rate_of_meetings);

  const signalCounts = {};
  ACCOUNTS.forEach(a => a.signals.forEach(s => { if (s.detected) signalCounts[s.signal_name] = (signalCounts[s.signal_name] || 0) + 1; }));

  const pct = (n, d) => d > 0 ? Math.round((n / d) * 100) : null;
  const acceptanceRate = (judged) => pct(judged.filter(j => j === "approved").length, judged.length);

  const wrap = el(`<div>

      <div class="panel-head"><h2>Illustrative funnel continuation</h2></div>

        <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:0">
          <div class="kpi"><div class="v">${replies}</div><div class="l">Positive replies (illustrative)</div></div>
          <div class="kpi"><div class="v">${meetings}</div><div class="l">Meetings booked (illustrative)</div></div>
          <div class="kpi"><div class="v">${opportunities}</div><div class="l">Opportunities created (illustrative)</div></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Closed-loop learning</h2><span class="hint">how the system would learn from real replies, once there are any</span></div>
      <div class="body-pad" style="overflow-x:auto">
        <p style="margin:0 0 8px;font-size:13.5px;color:var(--muted)">No outreach has been sent yet, so there is no real reply data — the rates below are illustrative, standing in for what a batch of real replies would look like broken out by the signal that triggered contact. What's real is the mechanism: a suggestion computed from that table, applied to ICP Config <strong>only if a human clicks Approve</strong>.</p>

            <tr><td>IT hiring</td><td>4%</td></tr>
            <tr><td>Remote workforce</td><td>2%</td></tr>

        <div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
          <div class="kpi"><div class="v tier-a">${avgScoreA ?? "—"}</div><div class="l">Avg. score — Tier A</div></div>
          <div class="kpi"><div class="v tier-b">${avgScoreB ?? "—"}</div><div class="l">Avg. score — Tier B</div></div>
          <div class="kpi"><div class="v tier-c">${avgScoreC ?? "—"}</div><div class="l">Avg. score — Tier C</div></div>
        </div>
        ${fieldRow("Score separation (real)", scoreSeparated ? "A > B > C — the scorer is actually ranking accounts, not producing noise" : "Tiers are not cleanly separated in this run — check ICP Config weights")}
        ${fieldRow("AI reasoning — human acceptance rate", reasoningJudged.length > 0 ? `${acceptanceRate(reasoningJudged)}% approved as-is (${reasoningJudged.length}/${ACCOUNTS.length} accounts reviewed)` : "No reviews yet — use Approve/Would edit/Reject under \"AI interpretation\" on an account's detail page")}
        ${fieldRow("Outreach — human acceptance rate", outreachJudged.length > 0 ? `${acceptanceRate(outreachJudged)}% approved as-is (${outreachJudged.length}/${ACCOUNTS.length} accounts reviewed)` : "No reviews yet — use Approve/Would edit/Reject under \"Generated outreach\" on an account's detail page")}

  function renderClosedLoop() {
    const panel = wrap.querySelector("#closed-loop-panel");
    const suggestion = computeClosedLoopSuggestion();
    const changeText = [...suggestion.raises, ...suggestion.cuts].map(c => `${c.label} weight: ${c.from} → ${c.to} (${c.reasonSignal} at ${c.reasonRate} reply rate)`).join(" · ");
    if (CLOSED_LOOP_STATUS === "pending") {
      panel.innerHTML = "";
      panel.appendChild(el(`<div class="mini-flow" style="flex-direction:column;align-items:flex-start;gap:10px">

      panel.querySelector("#closed-loop-approve").addEventListener("click", () => {
        [...suggestion.raises, ...suggestion.cuts].forEach(c => { ICP_CONFIG.weights.signals[c.key] = c.to; });

      });

      panel.innerHTML = "";
      panel.appendChild(el(`<div class="mini-flow" style="flex-direction:column;align-items:flex-start;gap:10px">
        <div class="mf-node" style="background:rgba(22,163,74,.14);border-color:var(--good);color:var(--good)">Applied to ICP Config — this run's scores above already reflect it.</div>
        <button class="btn" id="closed-loop-revert">Revert this change</button>
      </div>`));
      panel.querySelector("#closed-loop-revert").addEventListener("click", () => {
        [...suggestion.raises, ...suggestion.cuts].forEach(c => { ICP_CONFIG.weights.signals[c.key] = c.from; });
        recomputePipeline();
        CLOSED_LOOP_STATUS = "pending";
        CLOSED_LOOP_LOG.unshift({ ts: new Date().toISOString(), action: "reverted", change: changeText, approved_by: "human (you, from this Outcomes page)" });
        render();
      });
    } else {
      panel.innerHTML = "";
      panel.appendChild(el(`<div class="mini-flow" style="flex-direction:column;align-items:flex-start;gap:10px">
        <div class="mf-node">Dismissed — no change applied.</div>
        <button class="btn" id="closed-loop-reconsider">Reconsider suggestion</button>
      </div>`));
      panel.querySelector("#closed-loop-reconsider").addEventListener("click", () => { CLOSED_LOOP_STATUS = "pending"; render(); });
    }

    const history = wrap.querySelector("#closed-loop-history");
    history.innerHTML = "";
    if (CLOSED_LOOP_LOG.length > 0) {
      history.appendChild(el(`<div>
        <p style="margin:0 0 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Decision log</p>
        ${CLOSED_LOOP_LOG.map(l => `<p style="margin:0 0 4px;font-size:12.5px;color:var(--muted)"><span class="tag ${l.action === "approved" ? "status-success" : l.action === "reverted" ? "status-retry" : "status-historical"}">${esc(l.action)}</span> ${new Date(l.ts).toLocaleString()} — ${esc(l.change)} — ${esc(l.approved_by)}</p>`).join("")}
      </div>`));
    }
  }
  renderClosedLoop();

  return wrap;
}

    rows.forEach(entry => {
      const statusClass = entry.system === "Public signal research" ? "status-historical" : (entry.status === "success" ? "status-success" : "status-failure");
      const statusLabel = entry.system === "Public signal research" ? "historical" : entry.status;
      tbody.appendChild(el(`<tr>
        <td>${new Date(entry.ts).toLocaleString()}</td>
        <td>${esc(entry.system)}</td>
        <td>${esc(entry.account)}</td>
        <td><span class="tag ${statusClass}">${esc(statusLabel)}</span></td>
        <td>${entry.latency_ms != null ? entry.latency_ms + "ms" : "—"}</td>
        <td style="color:var(--muted)">${esc(entry.detail)}</td>
      </tr>`));
    });
  }
  renderRows();
  wrap.querySelectorAll(".filter-row button").forEach(btn => btn.addEventListener("click", () => {
    healthFilter = btn.dataset.hf;
    wrap.querySelectorAll(".filter-row button").forEach(b => b.classList.toggle("active", b.dataset.hf === healthFilter));
    renderRows();
  }));

  return wrap;
}

// from live OpenAI calls this session, plus an optional operator-entered
// enrichment-tool cost (this pass used none — no Clay/ZoomInfo access — so

// whatever contact-enrichment tool it actually runs). Time-saved is a
// separate, clearly labeled estimate, never folded into the cost figure.

}
